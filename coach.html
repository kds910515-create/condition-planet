<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222.5%22%20fill%3D%22%2315171A%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2220.5%22%20fill%3D%22%23567AFF%22%2F%3E%3Cg%20transform%3D%22rotate(22%2050%2050)%22%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2250%22%20rx%3D%2239%22%20ry%3D%2212.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<title>코치 화면 · 운동리듬 찾기</title>
<style>
:root{--bg:#F5F4F0;--surface:#fff;--ink:#15171A;--ink2:#555B66;--ink3:#8D939D;--line:#E4E2DA;--line2:#EEECE6;--accent:#2F54EB;--accent-weak:#E9EDFD;--warm:#D9583B;--warm-weak:#FBEAE5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p,ul{margin:0;padding:0} ul{list-style:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 80px}
.head{display:flex;gap:14px 24px;align-items:center;flex-wrap:wrap;padding:20px 0 16px;border-bottom:1px solid var(--line)}
.head h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.phase{font-weight:700;color:var(--ink2)}
.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.timer.over{color:var(--warm)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;white-space:nowrap}
.btn.big{min-height:60px;font-size:18px;padding:0 28px;border-radius:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.warn{background:var(--warm)}
.btn[disabled]{opacity:.4;cursor:default}
.now{display:flex;gap:16px 28px;align-items:center;flex-wrap:wrap;padding:20px 0}
.now .txt{flex:1;min-width:260px}
.now .txt b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
.now .txt span{color:var(--ink2)}
.stats{display:flex;gap:18px;font-weight:600;color:var(--ink2)}
.stats b{font-size:22px;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:#ECEAE4;border-radius:18px;padding:14px}
.col h2{font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col h2 small{font-size:12px;color:var(--ink2);font-weight:600}
.col .ordline{font-size:13px;color:var(--ink2);margin:2px 0 10px}
.col .ordline b.cur{color:var(--ink);background:var(--surface);padding:1px 6px;border-radius:6px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.mc .n{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px;font-weight:700}
.mc .s{font-size:13px;color:var(--ink2);margin-top:2px}
.mc .tr{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}
.pt{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--line2);color:var(--ink2)}
.pt.up{background:var(--accent-weak);color:#1F3CB5}.pt.down{background:var(--warm-weak);color:#9B331B}.pt.wait{border:1px dashed var(--ink3);background:transparent}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--line2);color:var(--ink2);margin-left:4px}
.tag.bot{border:1px dashed var(--ink3);background:transparent}.tag.v2{background:var(--accent);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
select{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 6px;font-size:13px}
h2.sec{font-size:18px;font-weight:800;margin:34px 0 4px}
.subx{color:var(--ink2);font-size:13px;margin-bottom:10px}
.concl li{padding:12px 0;border-bottom:1px solid var(--line);font-size:18px;font-weight:500;max-width:70ch}
.concl li:first-child{border-top:2px solid var(--ink)}
.concl b{background:var(--accent-weak);padding:0 5px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.concl b.bad{background:var(--warm-weak)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px;background:var(--surface);border-radius:14px;overflow:hidden}
th{font-size:12px;color:var(--ink3);text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line2);white-space:nowrap;font-variant-numeric:tabular-nums}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px}
.copy{display:flex;gap:8px;margin-top:6px}.copy input{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);padding:0 10px;min-width:0;background:var(--surface)}
textarea{width:100%;min-height:74px;border-radius:10px;border:1px solid var(--line);padding:8px 10px;background:var(--surface)}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 12px}
.five button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}.five button.on{background:var(--ink);color:#fff}
.scrim{position:fixed;inset:0;background:rgba(21,23,26,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{width:min(440px,100%);background:var(--bg);border-radius:18px;padding:20px}
.modal h3{font-size:18px;font-weight:800;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}#toast.on{opacity:1}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--ink2);padding:24px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="center">불러오는 중…</div></div>
<div id="modal"></div><div id="toast"></div>
<script src="logic.js"></script>
<script>
(() => {
'use strict';
const CFG = { url: 'https://mcemapuswhvrjmlqtmxi.supabase.co', key: 'sb_publishable_tQnXHsXFkmfYGlcpQ3-uSg_Z3qzTtqM' };
const L = CPClass, ST = L.ST, q = new URLSearchParams(location.search);
const slug = (q.get('c') || 'ochang-1024').toLowerCase();
let coachKey = q.get('k') || '';
try { if (coachKey) localStorage.setItem('cp15.coach.' + slug, coachKey); else coachKey = localStorage.getItem('cp15.coach.' + slug) || ''; } catch (_) {}
if (q.get('k')) try { history.replaceState(null, '', location.pathname + '?c=' + slug); } catch (_) {}     // keep the secret out of the address bar and screenshots
const S = { d: null, off: 0, err: null, modal: null, arm: null, sig: '', busy: false };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (x) => document.querySelector(x);
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
async function rpc(fn, args) {
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ p_class: slug, p_key: coachKey }, args || {})), cache: 'no-store' });
  const t = await r.text(); let d = null; try { d = t ? JSON.parse(t) : null; } catch (_) {}
  if (!r.ok) { const e = new Error((d && d.message) || 'http_' + r.status); e.code = (d && d.message) || ''; throw e; }
  return d;
}
async function load() {
  try { const d = await rpc('v15_coach_state'); S.d = d; S.off = d.class.now_ms - Date.now(); S.err = null; }
  catch (e) { S.err = e.code === 'forbidden' ? 'forbidden' : 'net'; }
  render();
}
async function act(p, ok) { if (S.busy) return; S.busy = true; try { await p; if (ok) toast(ok); } catch (e) { toast(e.code === 'teams_missing' ? '팀이 없는 회원이 있습니다. 먼저 팀을 배정해 주세요.' : '실패했습니다. 다시 눌러 주세요.'); } S.busy = false; await load(); }
const PH = ['intake', 'teams', 'r1', 'c1', 'r2', 'c2', 'r3', 'c3', 'done'];
const PHL = { intake: '입장 · 시작 전 체크', teams: '팀 편성 완료', r1: '1번째 블록 진행 중', c1: '1번째 체크', r2: '2번째 블록 진행 중', c2: '2번째 체크', r3: '3번째 블록 진행 중', c3: '3번째 체크', done: '마무리 · 리포트' };
const clock = (ms) => { const neg = ms < 0, s = Math.abs(Math.ceil(ms / 1000)); return (neg ? '+' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const left = () => (S.d.class.started_ms + S.d.class.minutes * 60000) - (Date.now() + S.off);
const memberUrl = () => new URL('./?c=' + slug, location.href).href;

function nextAction(c, M) {
  const ready = M.filter((m) => m.intake), teamed = ready.filter((m) => m.team), round = c.phase[1] ? +c.phase[1] : 0;
  const checked = (r) => teamed.filter((m) => m.checks.some((x) => x.round === r)).length;
  if (c.phase === 'intake') return { t: '회원들이 들어와 선호와 지금 상태를 체크하는 단계입니다.', s: `입장 ${M.length}명 · 체크 완료 ${ready.length}명. 모두 끝나면 팀을 편성하세요.`, b: ready.length ? ['teams-auto', `팀 편성하기 (${ready.length}명)`] : null };
  if (c.phase === 'teams') return { t: '팀과 순서가 회원 폰에 표시됐습니다.', s: '각 팀이 첫 구역으로 이동하면 시작하세요.', b: ['phase:r1', `1번째 블록 시작 (${c.minutes}분)`] };
  if (c.phase[0] === 'r') return { t: `${round}번째 블록 진행 중입니다.`, s: `시간이 끝나면 회원 폰이 자동으로 체크 화면으로 바뀝니다. 지금까지 체크 ${checked(round)}/${teamed.length}명.`, b: ['phase:c' + round, '블록 끝내고 체크 받기'], timer: true };
  if (c.phase[0] === 'c' && round < 3) return { t: `${round}번째 체크를 받는 중입니다. ${checked(round)}/${teamed.length}명 완료.`, s: '다음 구역으로 이동시킨 뒤 시작하세요. 체크를 못 한 회원은 카드에서 대신 입력할 수 있습니다.', b: ['phase:r' + (round + 1), `${round + 1}번째 블록 시작 (${c.minutes}분)`] };
  if (c.phase === 'c3') return { t: `마지막 체크를 받는 중입니다. ${checked(3)}/${teamed.length}명 완료.`, s: '체크를 마친 회원 폰에는 개인 리포트가 바로 뜹니다.', b: ['phase:done', '마무리하기'] };
  return { t: '수업이 끝났습니다.', s: '아래 결과를 화면에 띄우고, 한 달 프로그램 신청자를 확인하세요.', b: null };
}
function card(m, c) {
  const p = m.pref || {}, like = L.KEYS.filter((k) => p[k] > 0).map((k) => ST[k].ko), dis = L.KEYS.filter((k) => p[k] < 0).map((k) => ST[k].ko);
  const round = c.phase[1] ? +c.phase[1] : 0;
  let pm = m.mood0, tr = m.intake ? `<span class="pt">시작 ${m.mood0}·${m.body0}</span>` : '';
  if (m.ord) [1, 2, 3].forEach((r) => {
    const x = m.checks.find((y) => y.round === r);
    if (x) { const d = x.mood - pm; tr += `<span class="pt ${d > 0 ? 'up' : d < 0 ? 'down' : ''}" title="${ST[x.station].ko} 뒤 기분·몸">${ST[x.station].ko} ${x.mood}·${x.body}</span>`; pm = x.mood; }
    else if (r <= round && (c.phase[0] === 'c' || c.phase === 'done' || r < round)) tr += `<button class="pt wait" data-act="proxy" data-id="${m.id}" data-r="${r}">${r}번째 미체크 · 대신 입력</button>`;
  });
  return `<div class="mc"><div class="n"><span>${esc(m.name)}${m.is_bot ? '<span class="tag bot">가상</span>' : ''}${m.want_v2 === true ? '<span class="tag v2">한 달 신청</span>' : ''}</span>
    <span class="tools" style="margin:0"><select data-move="${m.id}" aria-label="팀 이동"><option value="">팀 이동</option>${L.TEAMS.map((t) => `<option value="${t.id}">${t.name}</option>`).join('')}</select><button class="btn ghost sm" data-act="remove" data-id="${m.id}" title="명단에서 삭제">×</button></span></div>
    <div class="s">${m.intake ? `에너지 ${m.energy0}${like.length ? ' · 좋아함 ' + like.join('·') : ''}${dis.length ? ' · 싫어함 ' + dis.join('·') : ''}` : '시작 전 체크 중…'}</div><div class="tr">${tr}</div></div>`;
}
function resultHtml(M) {
  const R = L.summary(M); if (!R.n) return '';
  const sg = (v) => (v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1));
  const st = R.stations.filter((x) => x.n).sort((a, b) => b.dm - a.dm), best = st[0];
  const lines = [
    `${R.n}명 중 <b>${R.up}명</b>은 들어올 때보다 좋은 기분으로 끝났고, <b>${R.same}명</b>은 그대로, <b class="${R.down ? 'bad' : ''}">${R.down}명</b>은 내려갔습니다. 평균 기분 <b>${R.mood0.toFixed(1)} → ${R.mood3.toFixed(1)}</b>, 몸 상태 <b>${R.body0.toFixed(1)} → ${R.body3.toFixed(1)}</b>.`,
    best ? `기분을 가장 많이 올린 블록은 ${ST[best.k].ko}(<b>${sg(best.dm)}</b>)입니다. ` + st.slice(1).map((x) => `${ST[x.k].ko} <b class="${x.dm < 0 ? 'bad' : ''}">${sg(x.dm)}</b>`).join(', ') + '.' : '',
    R.disliked.n ? `'싫어한다'고 고른 운동 뒤 기분 변화는 평균 <b class="${R.disliked.dm < 0 ? 'bad' : ''}">${sg(R.disliked.dm)}</b>(${R.disliked.n}번)` + (R.liked.n ? `, '좋아한다'고 고른 운동 뒤는 <b>${sg(R.liked.dm)}</b>(${R.liked.n}번)였습니다.` : '였습니다.') : '',
    `순서로 보면 1번째 블록 <b>${sg(R.rounds[0])}</b>, 2번째 <b>${sg(R.rounds[1])}</b>, 3번째 <b>${sg(R.rounds[2])}</b>.`,
    `한 달 프로그램 신청: <b>${R.optin.length}명</b>${R.optin.length ? ' (' + R.optin.map(esc).join(', ') + ')' : ''}.`,
  ].filter(Boolean);
  const rows = M.filter((m) => m.checks.length >= 3).map((m) => { const rep = L.report(m); return `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.kind || '')}</td><td>${m.mood0}·${m.body0}</td>${rep.rows.map((r) => `<td>${ST[r.st].ko}${r.pref ? (r.pref > 0 ? ' ♥' : ' ✕') : ''} ${r.m1}·${r.b1} <span class="pt ${r.dm > 0 ? 'up' : r.dm < 0 ? 'down' : ''}">${L.sg(r.dm) || 0}</span></td>`).join('')}<td>${esc(rep.week[0].x)}</td><td>${m.want_v2 === true ? '신청' : m.want_v2 === false ? '안 함' : '—'}</td></tr>`; }).join('');
  return `<h2 class="sec">오늘의 결론</h2><p class="subx">숫자는 기분·몸 상태(1~5). ♥ 좋아한다고 고른 운동, ✕ 싫어한다고 고른 운동.</p><ul class="concl">${lines.map((x) => `<li>${x}</li>`).join('')}</ul>
  <h2 class="sec">회원별 결과</h2><div class="scroll"><table><thead><tr><th>회원</th><th>팀</th><th>시작</th><th>1번째</th><th>2번째</th><th>3번째</th><th>이번 주 기본 순서</th><th>한 달</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function view() {
  if (S.err === 'forbidden' || !coachKey) return `<div class="center"><div><h1 style="font-size:22px;margin-bottom:8px">코치 전용 화면입니다</h1><p>전달받은 코치 링크로 다시 열어 주세요.</p></div></div>`;
  if (!S.d) return `<div class="center">${S.err ? '연결 중… 잠시만 기다려 주세요.' : '불러오는 중…'}</div>`;
  const c = S.d.class, M = S.d.members, na = nextAction(c, M), un = M.filter((m) => !m.team), running = c.phase[0] === 'r';
  const cur = c.phase[1] ? +c.phase[1] : 0;
  const cols = L.TEAMS.map((t) => { const a = M.filter((m) => m.team === t.id); return `<div class="col"><h2>${t.name}<small>${a.length}명</small></h2><p class="ordline">${t.ord.map((k, i) => (i + 1 === cur ? `<b class="cur">${ST[k].ko}</b>` : ST[k].ko)).join(' → ')}</p>${a.map((m) => card(m, c)).join('') || '<p class="subx">아직 없음</p>'}</div>`; }).join('');
  return `<div class="head"><h1>${esc(c.title)}</h1><span class="phase">${PHL[c.phase]}</span>${na.timer ? `<span class="timer${left() < 0 ? ' over' : ''}" id="timer">${clock(left())}</span>` : ''}
      <div class="stats"><span><b>${M.length}</b>입장</span><span><b>${M.filter((m) => m.intake).length}</b>체크</span><span><b>${M.filter((m) => m.checks.length >= 3).length}</b>완료</span></div></div>
    <div class="now"><div class="txt"><b>${na.t}</b><span>${na.s}</span></div>${na.b ? `<button class="btn big" data-act="${na.b[0]}"${S.busy ? ' disabled' : ''}>${na.b[1]}</button>` : ''}</div>
    ${un.length ? `<div class="col" style="margin-bottom:14px"><h2>아직 팀이 없는 회원<small>${un.length}명</small></h2>${c.phase !== 'intake' && un.some((m) => m.intake) ? '<div class="tools"><button class="btn sm" data-act="late">늦게 온 회원 자동 배정</button></div>' : ''}<div class="cols" style="margin-top:4px">${un.map((m) => card(m, c)).join('')}</div></div>` : ''}
    <div class="cols">${cols}</div>
    ${resultHtml(M)}
    <h2 class="sec">회원에게 보낼 링크</h2><div class="copy"><input readonly id="mlink" value="${esc(memberUrl())}"><button class="btn ghost" data-act="copy">복사</button></div>
    <h2 class="sec">리허설 · 설정</h2><p class="subx">혼자서 처음부터 끝까지 돌려 볼 수 있습니다. 가상 회원은 체크 단계에서 스스로 답합니다. 블록 시간을 1분으로 줄이면 5분 안에 끝납니다.</p>
    <div class="box"><div class="tools"><button class="btn ghost sm" data-act="fill">가상 회원 8명 채우기</button><button class="btn ghost sm" data-act="reset" data-v="bots">가상 회원만 삭제</button><button class="btn ghost sm" data-act="reset" data-v="progress">팀·체크만 초기화 (명단 유지)</button><button class="btn ghost sm" style="color:var(--warm)" data-act="reset" data-v="all">전체 초기화</button>
      <span>블록 시간 <select data-minutes>${[15, 10, 5, 3, 1].map((v) => `<option${v === c.minutes ? ' selected' : ''}>${v}</option>`).join('')}</select> 분</span>${c.phase !== 'intake' ? '<button class="btn ghost sm" data-act="teams-auto">팀 다시 편성</button>' : ''}<button class="btn ghost sm" data-act="routines">구역별 운동 안내 수정</button></div></div>`;
}
function modalHtml() {
  const m = S.modal; if (!m) return '';
  if (m.type === 'proxy') return `<div class="scrim"><div class="modal"><h3>${esc(m.name)} · ${m.r}번째 체크 대신 입력</h3><p class="subx">기분</p><div class="five">${[1, 2, 3, 4, 5].map((v) => `<button class="${m.mood === v ? 'on' : ''}" data-px="mood" data-v="${v}">${v}</button>`).join('')}</div><p class="subx">몸 상태</p><div class="five">${[1, 2, 3, 4, 5].map((v) => `<button class="${m.body === v ? 'on' : ''}" data-px="body" data-v="${v}">${v}</button>`).join('')}</div><div class="tools"><button class="btn" data-act="proxy-save"${m.mood && m.body ? '' : ' disabled'}>저장</button><button class="btn ghost" data-act="close">취소</button></div></div></div>`;
  if (m.type === 'confirm') return `<div class="scrim"><div class="modal"><h3>${esc(m.title)}</h3><p class="subx">${esc(m.text)}</p><div class="tools"><button class="btn warn" data-act="confirm-yes">${esc(m.yes)}</button><button class="btn ghost" data-act="close">취소</button></div></div></div>`;
  if (m.type === 'routines') { const r = S.d.class.routines || {}; return `<div class="scrim"><div class="modal"><h3>구역별 운동 안내</h3><p class="subx">회원 폰의 블록 화면에 그대로 나옵니다. 한 줄에 하나씩.</p>${L.KEYS.map((k) => `<p class="subx" style="margin:8px 0 4px"><b>${ST[k].ko}</b></p><textarea id="rt-${k}">${esc((r[k] || []).join('\n'))}</textarea>`).join('')}<div class="tools"><button class="btn" data-act="routines-save">저장</button><button class="btn ghost" data-act="close">취소</button></div></div></div>`; }
  return '';
}
function render(force) {
  const html = view(), sig = html.replace(/id="timer">[^<]*</, '') + S.busy;
  if (!force && sig === S.sig) { const t = $('#timer'); if (t) { t.textContent = clock(left()); t.classList.toggle('over', left() < 0); } return; }
  if (!force && document.activeElement && document.activeElement.tagName === 'SELECT') return;   // do not close an open dropdown
  S.sig = sig; $('#root').innerHTML = html;
}
const modal = (m) => { S.modal = m; $('#modal').innerHTML = modalHtml(); };
const ready = () => S.d.members.filter((m) => m.intake);
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return; const d = b.dataset, a = d.act || '';
  if (d.px) { S.modal[d.px] = +d.v; modal(S.modal); return; }
  if (a === 'close') return modal(null);
  if (a === 'teams-auto') { const plan = L.assign(ready()); const go = async () => { await rpc('v15_coach_teams', { p_assign: plan }); if (S.d.class.phase === 'intake') await rpc('v15_coach_phase', { p_phase: 'teams' }); }; if (S.d.class.phase === 'intake') act(go(), '팀을 편성했습니다.'); else modal({ type: 'confirm', title: '팀을 다시 편성할까요?', text: '이미 진행 중이면 회원들의 순서가 바뀝니다.', yes: '다시 편성', fn: go }); }
  else if (a === 'late') act(rpc('v15_coach_teams', { p_assign: S.d.members.filter((m) => m.intake && !m.team).map(L.one) }), '배정했습니다.');
  else if (a.startsWith('phase:')) act(rpc('v15_coach_phase', { p_phase: a.slice(6) }));
  else if (a === 'copy') { const el = $('#mlink'); (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject()).then(() => toast('복사했습니다.')).catch(() => { el.select(); toast('선택된 주소를 복사해 주세요.'); }); }
  else if (a === 'fill') act(rpc('v15_coach_fill', { p_n: 8 }), '가상 회원 8명을 넣었습니다.');
  else if (a === 'reset') { const t = { bots: ['가상 회원을 삭제할까요?', '가상 회원과 그 기록만 지웁니다.'], progress: ['팀과 체크 기록을 초기화할까요?', '명단과 시작 전 체크는 남고, 팀·블록 체크·신청 여부가 지워집니다.'], all: ['전체를 초기화할까요?', '이 수업의 모든 회원과 기록이 영구 삭제됩니다. 실제 수업이 끝난 뒤에는 누르지 마세요.'] }[d.v]; modal({ type: 'confirm', title: t[0], text: t[1], yes: '초기화', fn: () => rpc('v15_coach_reset', { p_what: d.v }) }); }
  else if (a === 'confirm-yes') { const fn = S.modal.fn; modal(null); act(fn(), '완료했습니다.'); }
  else if (a === 'remove') { const m = S.d.members.find((x) => x.id === d.id); modal({ type: 'confirm', title: `${m.name} 님을 명단에서 삭제할까요?`, text: '이 회원의 기록이 지워집니다.', yes: '삭제', fn: () => rpc('v15_coach_remove', { p_member: d.id }) }); }
  else if (a === 'proxy') { const m = S.d.members.find((x) => x.id === d.id); modal({ type: 'proxy', id: m.id, name: m.name, r: +d.r, mood: null, body: null }); }
  else if (a === 'proxy-save') { const m = S.modal; modal(null); act(rpc('v15_coach_check', { p_member: m.id, p_round: m.r, p_mood: m.mood, p_body: m.body }), '저장했습니다.'); }
  else if (a === 'routines') modal({ type: 'routines' });
  else if (a === 'routines-save') { const r = {}; L.KEYS.forEach((k) => { r[k] = $('#rt-' + k).value.split('\n').map((x) => x.trim()).filter(Boolean).slice(0, 6); }); modal(null); act(rpc('v15_coach_config', { p_routines: r, p_minutes: null }), '저장했습니다.'); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.move && el.value) { const m = S.d.members.find((x) => x.id === el.dataset.move), t = L.TEAMS.find((x) => x.id === +el.value); el.blur(); act(rpc('v15_coach_teams', { p_assign: [{ id: m.id, team: t.id, ord: t.ord, kind: t.name, reason: m.intake ? L.reason(m, t) : t.line }] }), '옮겼습니다.'); }
  else if ('minutes' in el.dataset) { el.blur(); act(rpc('v15_coach_config', { p_routines: null, p_minutes: +el.value }), '블록 시간을 바꿨습니다.'); }
});
setInterval(() => { if (!S.modal) render(); }, 1000);
setInterval(() => { if (!document.hidden && !S.modal && !S.busy) load(); }, 3000);
load();
})();
</script>
</body>
</html>
