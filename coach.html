<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<title>컨디션 플래닛 · 코치 화면</title>
<style>
:root{--bg:#F6F7F9;--card:#fff;--ink:#0E1116;--ink2:#4A5160;--ink3:#8B93A1;--line:#E6E8EC;--soft:#EEF0F3;--down:#C2341A;--down-w:#FFE9E5;--ok:#12B76A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
.n{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px 130px}
.top{display:flex;align-items:center;gap:10px;height:64px}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:800}
.pill{font-size:11px;font-weight:700;color:var(--ink2);background:var(--soft);padding:3px 9px;border-radius:999px}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;white-space:nowrap}
.btn:hover{opacity:.92}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.xl{min-height:68px;font-size:20px;padding:0 30px;border-radius:20px}
.btn.warn{background:var(--down)}
.btn[disabled]{opacity:.4;cursor:default}
/* stage */
.stage{background:var(--card);border-radius:28px;padding:28px 30px;box-shadow:0 1px 2px rgba(14,17,22,.04),0 0 0 1px var(--line)}
.stage h1{font-size:15px;font-weight:700;color:var(--ink3)}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.rail div{font-size:12px;font-weight:700;color:var(--ink3)}
.rail i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:8px}
.rail .past i{background:var(--ink)} .rail .cur i{background:var(--ink);position:relative;overflow:hidden}
.rail .cur i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 1.6s infinite}@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.rail .cur,.rail .past{color:var(--ink)}
.now{display:flex;gap:20px 36px;align-items:center;flex-wrap:wrap;margin-top:24px}
.now .txt{flex:1;min-width:300px}
.now .txt b{display:block;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.now .txt span{display:block;color:var(--ink2);font-size:16px;margin-top:6px;max-width:60ch}
.clock{font-size:72px;font-weight:800;letter-spacing:-.04em;line-height:1}
.clock.over{color:var(--down)}
.kpis{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.kpi{display:flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:14px;background:var(--soft);font-weight:700;color:var(--ink2);font-size:13px}
.kpi b{font-size:22px;font-weight:800;color:var(--ink)}
.kpi .meter{align-self:center;width:90px;height:6px;border-radius:3px;background:#DADDE3;overflow:hidden}.kpi .meter i{display:block;height:100%;background:var(--ok)}
/* lanes */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px;align-items:start}
.lane{border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.lane header{padding:18px 20px 16px;color:#fff}
.lane header h2{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:baseline}
.lane header h2 small{font-size:13px;font-weight:700;opacity:.9}
.route{display:flex;gap:6px;margin-top:12px}
.route span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.2)}
.route span.cur{background:#fff;color:var(--ink)}
.lane .body{padding:8px 12px 12px;display:grid;gap:8px}
.mc{border-radius:16px;padding:12px 14px;background:var(--bg)}
.mc .r1{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.mc .nm{font-size:17px;font-weight:800;line-height:1.2}
.mc .meta{font-size:12px;font-weight:600;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

.traj{display:flex;align-items:center;gap:6px;margin-top:10px}
.pt{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--ink3);min-width:38px}
.pt b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;background:var(--ink)}
.pt.wait b{background:transparent;color:var(--ink3);box-shadow:inset 0 0 0 1.5px dashed var(--line);border:1.5px dashed #C9CED6}
.pt.todo b{background:var(--soft);color:var(--ink3)}
.traj .ln{flex:1;height:2px;background:var(--line);margin-bottom:14px;min-width:6px}
.dl{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--ink2);margin-bottom:14px}
.dl.up{background:var(--ink);color:#fff}.dl.down{background:var(--down-w);color:var(--down)}
.tagv{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--ink);color:#fff}
.tagb{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px dashed var(--ink3);color:var(--ink3)}
select{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);padding:0 6px;font-size:13px}
.empty{padding:22px 10px;text-align:center;color:var(--ink3);font-weight:600;font-size:14px}
/* results */
h2.sec{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:44px 0 6px}
.subx{color:var(--ink2);margin-bottom:14px}
.res{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.box{background:var(--card);border-radius:24px;padding:24px;box-shadow:0 0 0 1px var(--line)}
.box h3{font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:14px}
.concl li{padding:14px 0;border-top:1px solid var(--soft);font-size:19px;font-weight:600;line-height:1.5;letter-spacing:-.01em}
.concl li:first-child{border-top:0;padding-top:0}
.concl b{background:#FFF1B8;padding:0 6px;border-radius:6px;font-weight:800;white-space:nowrap}
.concl b.bad{background:var(--down-w);color:var(--down)}
.hbar{display:grid;grid-template-columns:86px minmax(0,1fr) 56px;gap:12px;align-items:center;padding:8px 0;font-weight:700}
.hbar .t{height:26px;border-radius:8px;background:var(--soft);overflow:hidden}.hbar .t i{display:block;height:100%;border-radius:8px;min-width:4px}
.hbar .v{text-align:right;font-weight:800;font-size:17px}
.hbar .l{display:flex;align-items:center;gap:8px}
.icw{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font-size:12px;color:var(--ink3);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--soft);white-space:nowrap}
.seq{display:flex;gap:2px;height:22px;width:180px}.seq span{border-radius:6px;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.copy{display:flex;gap:8px}.copy input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;min-width:0;background:var(--card);font-weight:600}
textarea{width:100%;min-height:74px;border-radius:12px;border:1px solid var(--line);padding:8px 10px;background:var(--card)}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 14px}

.scrim{position:fixed;inset:0;background:rgba(14,17,22,.5);display:grid;place-items:center;padding:16px;z-index:20}
.modal{width:min(460px,100%);background:var(--bg);border-radius:24px;padding:24px;max-height:92vh;overflow:auto}
.modal h3{font-size:20px;font-weight:800;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:11px 18px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}#toast.on{opacity:1}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--ink2);padding:24px}
details.set{margin-top:40px}details.set summary{cursor:pointer;font-weight:700;color:var(--ink2);padding:10px 0}
body.show details.set,body.show .linkbox,body.sim details.set,body.sim .linkbox{display:none}

.now .txt em{display:block;font-style:normal;font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:.02em;margin-bottom:4px}
.mc{cursor:pointer;transition:box-shadow .12s;box-shadow:inset 0 0 0 1px transparent}
.mc:hover,.mc:focus-visible{box-shadow:inset 0 0 0 1.5px #C9CED6;outline:none}
.mc.wait{background:#FFF8E1;box-shadow:inset 0 0 0 1.5px #F5C542}
.mc .who{min-width:0;flex:1}
.mc .meta{font-size:13px;gap:8px;align-items:center}
.mc .meta .gl{font-weight:700;color:var(--ink2)}
.lowb{font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--down-w);color:var(--down)}
.stt{flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink3);white-space:nowrap}
.stt.wait{background:#F5C542;color:#3A2E00}.stt.ok{background:#DDF5E9;color:#0B7A4B}.stt.v2{background:var(--ink);color:#fff}
.rxl{display:grid;gap:1px;font-size:13px;line-height:1.45;color:var(--ink2);margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--card)}
.rxl b{font-size:12px;font-weight:800}
.rxl .ez{font-style:normal;font-size:11px;font-weight:800;padding:0 6px;border-radius:5px;background:var(--down-w);color:var(--down)}
.pt{font-size:11px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.rgrid .mc{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.secs{display:block;font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0;margin-top:2px}
p.empty.box{padding:30px}
.dock{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);width:min(980px,calc(100% - 28px));display:flex;align-items:center;gap:18px;padding:12px 12px 12px 22px;border-radius:24px;background:var(--card);box-shadow:0 18px 50px rgba(14,17,22,.28),0 0 0 1px var(--line);transition:transform .22s ease,visibility .22s;z-index:10;visibility:hidden}
.dock.on{transform:translate(-50%,0);visibility:visible}
.dock .dtx{flex:1;min-width:0}.dock .dtx em{display:block;font-style:normal;font-size:12px;font-weight:800;color:var(--ink3)}
.dock .dtx b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .clock{font-size:34px}.dock .btn.xl{min-height:54px;font-size:17px;border-radius:16px;padding:0 22px}
.modal.wide{width:min(620px,100%)}.modal.lib{width:min(1040px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.mh h3{margin:0;font-size:22px}
.mh .x{width:38px;height:38px;border-radius:12px;background:var(--soft);font-size:22px;line-height:1;color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink2)}.chip.dark{background:var(--ink);color:#fff}.chip b{color:var(--ink)}
.mlab{font-size:13px;font-weight:800;color:var(--ink3);margin:16px 0 6px}
.mtx{font-size:15px;line-height:1.6;color:var(--ink2)}
.rxlist li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.rxlist li:first-child{border-top:0}
.rxlist b{font-size:15px;font-weight:800}.rxlist p{font-size:14px;color:var(--ink2);line-height:1.5}
.tg{font-weight:800!important;font-size:15px!important}.nt{font-size:13px!important;color:var(--ink3)!important}
.ckv{font-size:13px;font-weight:800;padding:3px 9px;border-radius:8px;background:var(--soft);white-space:nowrap}
.mtools{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
body.show .mtools select,body.show .mtools .btn.ghost{display:none}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{min-height:42px;padding:0 16px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:700}
.pick button.on{background:var(--ink);color:#fff;box-shadow:none}
.libg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.libg section{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 0 0 1px var(--line)}
.libg h4{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.libg .ln1{font-size:13px;font-weight:700;color:var(--ink2)}
.libg ol li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--soft);font-size:13px;line-height:1.5}
.libg ol{margin-top:10px}.libg ol li span{font-weight:700;color:var(--ink3);font-size:12px;padding-top:1px}
.libg ol b{display:block;font-size:14px}.libg ol p{color:var(--ink2)}
@media (max-width:980px){.libg{grid-template-columns:1fr}.dock{gap:10px;padding:10px 10px 10px 16px}.dock .dtx b{font-size:15px}.dock .clock{font-size:26px}.dock .btn.xl{padding:0 14px;font-size:15px}}
</style>

<body>
<div class="wrap" id="root"><div class="center">불러오는 중…</div></div>
<div id="modal"></div><div id="toast"></div>
<script>
/* Condition Planet V1.5 — one-day class logic (shared by the member page and the coach page).
   assign(): puts people with similar preferences and condition in the same team and gives each team an order of the three stations.
   report(): turns one person's start state + three checks into findings, a one-week plan and a cautious one-month outlook. */
(function (g) {
'use strict';
const ST = { cardio: { ko: '유산소', c: '#FF6A3D', w: '#FFEEE7' }, weights: { ko: '웨이트', c: '#3D5AFE', w: '#E9EDFF' }, stretch: { ko: '스트레칭', c: '#0FA37A', w: '#E2F6EF' } };
const KEYS = ['cardio', 'weights', 'stretch'];
const TEAMS = [
  { id: 1, name: '달리기 팀', ord: ['cardio', 'weights', 'stretch'], line: '심박을 먼저 올리고, 힘을 쓰고, 풀면서 끝냅니다.' },
  { id: 2, name: '힘쓰기 팀', ord: ['weights', 'stretch', 'cardio'], line: '힘이 있을 때 먼저 들고, 풀어 준 뒤, 유산소로 끝냅니다.' },
  { id: 3, name: '깨우기 팀', ord: ['stretch', 'cardio', 'weights'], line: '몸을 먼저 깨우고, 심박을 올린 뒤, 마지막에 힘을 씁니다.' },
];
const jong = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 : 0; };
const ro = (w) => w + (jong(w) === 0 || jong(w) === 8 ? '로' : '으로');
const un = (w) => w + (jong(w) ? '은' : '는');
const sg = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const lowCount = (m) => (m.energy0 <= 2 ? 1 : 0) + (m.body0 <= 2 ? 1 : 0) + (m.mood0 <= 2 ? 1 : 0);

// how well a station order fits one person right now
function score(m, t) {
  const p = m.pref || {}, first = t.ord[0], last = t.ord[2], low = lowCount(m);
  let s = 1.5 * (p[first] || 0) + 0.5 * (p[last] || 0);
  if (first === 'stretch') s += 1.2 * low;
  if (first === 'cardio') s += (m.energy0 >= 4 ? 1 : 0) - 0.8 * low;
  if (first === 'weights') s += (m.energy0 >= 4 && m.body0 >= 3 ? 0.8 : 0) - (m.body0 <= 2 ? 1.2 : 0) - 0.4 * low;
  return s;
}
const bestTeam = (m) => TEAMS.slice().sort((a, b) => score(m, b) - score(m, a))[0];
function reason(m, t) {
  const p = m.pref || {}, low = lowCount(m), first = ST[t.ord[0]].ko;
  const state = low >= 2 ? `지금 에너지 ${m.energy0}, 몸 상태 ${m.body0}로 낮은 편이라` : m.energy0 >= 4 ? `에너지가 ${m.energy0}로 충분해서` : '컨디션이 무난해서';
  let s = low >= 2 && t.ord[0] !== 'stretch' && bestTeam(m) !== t
    ? `오늘은 세 명씩 팀을 맞추느라 ${ro(first)} 시작합니다. 지금 에너지 ${m.energy0}, 몸 상태 ${m.body0}로 낮은 편이니 첫 블록은 평소보다 가볍게 하세요.`
    : `${state} ${ro(first)} 시작합니다. ${t.line}`;
  const dis = KEYS.filter((k) => p[k] < 0), like = KEYS.filter((k) => p[k] > 0);
  dis.forEach((k) => { const i = t.ord.indexOf(k); s += ` 싫어한다고 고른 ${un(ST[k].ko)} ${['맨 먼저 끝내도록 앞에', '몸이 풀린 가운데에', '마지막에'][i]} 넣었습니다.`; });
  if (dis.length) s += ' 하고 난 뒤 기분이 어떻게 변하는지 보는 것이 오늘의 실험입니다.';
  else if (like.length) s += ` 좋아하는 ${like.map((k) => ST[k].ko).join('·')}${like.length ? '도' : ''} 숫자로 확인해 봅니다.`;
  return s;
}
// Best total fit with balanced team sizes (exhaustive search; a class is small)
function assign(members) {
  const n = members.length; if (!n) return [];
  const hi = Math.ceil(n / 3), lo = n >= 3 ? Math.floor(n / 3) : 0, sc = members.map((m) => TEAMS.map((t) => score(m, t)));
  const maxRest = new Array(n + 1).fill(0); for (let i = n - 1; i >= 0; i--) maxRest[i] = maxRest[i + 1] + Math.max(...sc[i]);
  let best = null, bestV = -1e9; const cur = new Array(n), cnt = [0, 0, 0];
  (function go(i, v) {
    if (v + maxRest[i] <= bestV) return;
    if (i === n) { if (cnt.every((c) => c >= lo)) { bestV = v; best = cur.slice(); } return; }

  else if (a === 'copy') { const el = $('#mlink'); (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject()).then(() => toast('복사했습니다.')).catch(() => { el.select(); toast('선택된 주소를 복사해 주세요.'); }); }

  else if (a === 'reset') { const t = { bots: ['가상 회원을 삭제할까요?', '가상 회원과 그 기록만 지웁니다.'], progress: ['팀과 체크 기록을 초기화할까요?', '명단과 시작 전 체크는 남고, 팀·블록 체크·신청 여부가 지워집니다.'], all: ['전체를 초기화할까요?', '이 수업의 모든 회원과 기록이 영구 삭제됩니다. 실제 수업이 끝난 뒤에는 누르지 마세요.'] }[d.v]; modal({ type: 'confirm', title: t[0], text: t[1], yes: '초기화', fn: () => rpc('v15_coach_reset', { p_what: d.v }) }); }
  else if (a === 'confirm-yes') { const fn = S.modal.fn; modal(null); act(fn, '완료했습니다.'); }
  else if (a === 'remove') { const m = S.d.members.find((x) => x.id === d.id); modal({ type: 'confirm', title: `${m.name} 님을 명단에서 삭제할까요?`, text: '이 회원의 기록이 지워집니다.', yes: '삭제', fn: () => rpc('v15_coach_remove', { p_member: d.id }) }); }
  else if (a === 'proxy') { const m = S.d.members.find((x) => x.id === d.id); modal({ type: 'proxy', id: m.id, name: m.name, r: +d.r, mood: null, body: null }); }
  else if (a === 'proxy-save') { const m = S.modal; modal(null); act(() => rpc('v15_coach_check', { p_member: m.id, p_round: m.r, p_mood: m.mood, p_body: m.body }), '저장했습니다.'); }
  else if (a === 'routines') modal({ type: 'routines' });
  else if (a === 'routines-save') { const r = {}; L.KEYS.forEach((k) => { r[k] = $('#rt-' + k).value.split('\n').map((x) => x.trim()).filter(Boolean).slice(0, 6); }); modal(null); act(() => rpc('v15_coach_config', { p_routines: r, p_minutes: null }), '저장했습니다.'); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.move && el.value) { const m = S.d.members.find((x) => x.id === el.dataset.move), t = L.TEAMS.find((x) => x.id === +el.value); el.blur(); modal(null); act(() => rpc('v15_coach_teams', { p_assign: [{ id: m.id, team: t.id, ord: t.ord, kind: t.name, reason: m.intake ? L.reason(m, t) : t.line }] }), '옮겼습니다.'); }
  else if ('minutes' in el.dataset) { el.blur(); act(() => rpc('v15_coach_config', { p_routines: null, p_minutes: +el.value }), '블록 시간을 바꿨습니다.'); }
});
if (q.get('show')) document.body.classList.add('show');
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.modal) modal(null); else if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset && ev.target.dataset.detail && !S.modal) { ev.preventDefault(); modal({ type: 'detail', id: ev.target.dataset.detail }); } });
const dockSync = () => { const st = document.querySelector('.stage'), on = !!st && st.getBoundingClientRect().bottom < 40; if (on !== S.dock) { S.dock = on; const el = $('#dock'); if (el) el.classList.toggle('on', on); } };
addEventListener('scroll', dockSync, { passive: true }); addEventListener('resize', dockSync);
setInterval(() => { if (!S.modal) render(); }, 1000);
setInterval(() => { if (!PV && (SIM || !document.hidden) && !S.modal && !S.busy) load(); }, SIM ? 800 : 3000);
load();
})();
</script>
