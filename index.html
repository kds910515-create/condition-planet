<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222.5%22%20fill%3D%22%2315171A%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2220.5%22%20fill%3D%22%23567AFF%22%2F%3E%3Cg%20transform%3D%22rotate(22%2050%2050)%22%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2250%22%20rx%3D%2239%22%20ry%3D%2212.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>MY EXERCISE RHYTHM · 나만의 운동 리듬 찾기</title>
<style>
:root{--bg:#F6F7F9;--card:#fff;--ink:#0E1116;--ink2:#4A5160;--ink3:#8B93A1;--line:#E6E8EC;--soft:#EEF0F3;--down:#C2341A;--down-w:#FFE9E5;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;text-align:left}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
.n{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 12px) 20px calc(var(--sab) + 28px)}
.bar{display:flex;align-items:center;gap:8px;height:36px;font-weight:700;font-size:14px;margin-bottom:18px}
.bar .pill{font-size:11px;font-weight:700;color:var(--ink2);background:var(--soft);padding:3px 8px;border-radius:999px}
.bar .sp{flex:1}
.bar .net{font-size:12px;color:var(--down);font-weight:600;display:none}.bar .net.on{display:block}
.dots{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--ink3)}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.eyebrow{font-size:13px;font-weight:700;color:var(--ink3);display:flex;align-items:center;gap:8px}
.h1{font-size:28px;line-height:1.3;font-weight:800;letter-spacing:-.025em;margin-top:6px;white-space:pre-line}
.sub{font-size:15px;color:var(--ink2);margin-top:8px;line-height:1.6}
.note{font-size:13px;color:var(--ink3);line-height:1.55}
.card{background:var(--card);border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 1px 2px rgba(14,17,22,.04),0 0 0 1px var(--line)}
.card h2{font-size:13px;font-weight:800;color:var(--ink3);margin-bottom:10px;letter-spacing:.01em}
.quote{margin-top:16px;padding:20px;border-radius:22px;background:var(--ink);color:#fff;font-size:19px;font-weight:700;line-height:1.55;letter-spacing:-.01em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:62px;border-radius:18px;background:var(--ink);color:#fff;font-size:18px;font-weight:800;margin-top:18px;text-align:center}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line)}
.err{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--down-w);color:var(--down);font-size:14px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#12B76A;animation:p 1.5s infinite}@keyframes p{50%{opacity:.25}}
.field{display:block;margin-top:16px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.field input,.field textarea{width:100%;height:60px;padding:0 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:18px;font-weight:600;outline:none}
.field textarea{height:96px;padding:14px 18px;resize:none;font-size:16px;font-weight:500;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
/* intro */
.zones{display:grid;gap:8px;margin-top:14px}
.zrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.zrow .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.zrow b{display:block;font-size:17px;font-weight:800}.zrow small{font-size:13px;color:var(--ink2);font-weight:600}
/* survey */
.wz{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.wz button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-left:-10px;color:var(--ink2)}
.wz span{font-size:13px;font-weight:700;color:var(--ink3)}
.wzbar{height:4px;border-radius:2px;background:var(--line);margin:4px 0 18px;overflow:hidden}.wzbar i{display:block;height:100%;background:var(--ink)}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;min-height:62px;padding:0 20px;background:var(--card);border-radius:18px;font-size:18px;font-weight:700;box-shadow:0 0 0 1.5px var(--line)}
.opt.on{box-shadow:0 0 0 2.5px var(--ink)}
/* answers */
.q{margin-top:20px}.q:first-of-type{margin-top:2px}
.q>b{display:block;font-size:17px;font-weight:800;margin-bottom:10px}
.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:6px 2px;border-radius:15px;font-size:13px;font-weight:800;color:var(--ink2);text-align:center;background:var(--soft);line-height:1.2}
.ch .em{font-size:30px;line-height:1}
.ch small{font-size:10px;font-weight:700;color:var(--ink3)}
.ch.on{background:var(--ink);color:#fff}.ch.on small{color:#C9CED6}
.ends{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink3);margin-top:6px}
/* zone */
.zone{margin-top:14px;border-radius:26px;padding:20px 20px 22px;color:#fff}
.zone .k{font-size:14px;font-weight:800;opacity:.9}
.zone .t{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.zone .t small{display:block;font-size:17px;font-weight:700;opacity:.9;letter-spacing:0;margin-top:4px}
.big{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.3;white-space:pre-line}
.coachsay{margin-top:12px;font-size:17px;font-weight:700;color:var(--ink2)}
.top2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.left{font-size:13px;font-weight:700;color:var(--ink3)}.left b{font-size:17px;color:var(--ink);margin-left:4px}
.items{display:grid;gap:8px}
.it{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center}
.it svg{width:92px;height:64px;border-radius:12px;display:block}
.it b{display:block;font-size:17px;font-weight:800}.it span{font-size:13px;color:var(--ink2);font-weight:600}
.it.now{background:var(--soft);border-radius:16px;padding:6px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.ph div{padding:10px 8px;border-radius:14px;background:var(--soft);text-align:center;font-size:12px;font-weight:700;color:var(--ink3);line-height:1.3}
.ph div b{display:block;font-size:15px;font-weight:800;color:var(--ink2)}
.ph div.on{color:#fff}.ph div.on b{color:#fff}
.say{margin-top:12px;font-size:16px;font-weight:700;line-height:1.5}
.tip{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;line-height:1.55;color:var(--ink2)}
.cta{position:sticky;bottom:calc(var(--sab) + 10px);margin-top:18px;z-index:3}
.cta .btn{margin:0;box-shadow:0 10px 30px rgba(14,17,22,.25)}
.lnk{display:block;margin:14px auto 0;font-size:14px;font-weight:700;color:var(--ink3);text-align:center;text-decoration:underline;text-underline-offset:3px}
/* plan, flow, library */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink2)}.chip.dark{background:var(--ink);color:#fff}
.plan2 h4{font-size:15px;font-weight:800;margin:18px 0 4px}
.dy{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--soft)}
.dy .dd{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.dy small{display:block;font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:4px}
.bk{display:grid;gap:3px;padding:4px 0;font-size:14px;line-height:1.5;color:var(--ink2)}
.zc{justify-self:start;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;color:#fff}
.lt{font-style:normal;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--down-w);color:var(--down)}
.flow li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--soft)}.flow li:first-child{border-top:0;padding-top:0}
.flow li i{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.flow b{display:block;font-size:16px;font-weight:800}.flow b small{font-size:12px;color:var(--ink3);font-weight:700;margin-left:4px}
.flow p{font-size:14px;color:var(--ink2);line-height:1.5;margin-top:2px}
.closing{margin-top:12px;padding:16px 18px;border-radius:18px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;line-height:1.6}
.libtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lt3{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:104px;padding:14px;border-radius:20px;color:#fff;text-align:left}
.lt3 span{font-size:13px;font-weight:800;opacity:.85}.lt3 b{font-size:19px;font-weight:800;margin-top:auto}.lt3 small{font-size:12px;font-weight:700;opacity:.9}
.backbtn{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px 0 4px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:14px;font-weight:700;color:var(--ink2)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:14px;padding:4px;margin-top:14px}
.tabs3 button{height:42px;border-radius:11px;text-align:center;font-weight:800;font-size:15px;color:var(--ink2)}.tabs3 button.on{color:#fff}
.libl{display:grid;gap:10px;margin-top:14px}
.libl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 0 0 1px var(--line)}
.libl li svg,.libl .tile{width:96px;height:67px;border-radius:12px;display:grid;place-items:center}
.libl b{display:block;font-size:17px;font-weight:800;line-height:1.3}.libl p{font-size:14px;color:var(--ink2);line-height:1.5;margin-top:3px}
.yt{display:inline-flex;align-items:center;margin-top:8px;height:34px;padding:0 12px;border-radius:10px;background:#FF0033;color:#fff;font-size:13px;font-weight:800;text-decoration:none}
.rpage{padding-bottom:84px}
.rptop{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--ink3)}
.rptop b{color:var(--ink)}
.rpnav{display:flex;gap:6px;overflow-x:auto;margin:10px -20px 16px;padding:0 20px 2px;scrollbar-width:none}
.rpnav::-webkit-scrollbar{display:none}
.rpnav button{flex:none;height:34px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;color:var(--ink3)}
.rpnav button.past{color:var(--ink2)}.rpnav button.on{background:var(--ink);color:#fff}
.rpfoot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);display:grid;grid-template-columns:auto 1fr;gap:8px;padding:12px 20px calc(var(--sab) + 12px);background:linear-gradient(transparent,var(--bg) 26%);z-index:5}
.rpfoot .btn{margin:0;min-height:56px}.rpfoot .btn.ghost{padding:0 22px}
.rpfoot.one{grid-template-columns:1fr}
.tabs3.two{grid-template-columns:1fr 1fr}
/* rhythm */
.kot{font-size:15px;font-weight:700;color:var(--ink2);margin-top:4px}
.quote{font-size:17px}
.opts.tight{gap:8px;margin-top:16px}.opts.tight .opt{min-height:54px;font-size:16px;gap:12px}
.opt .box{width:24px;height:24px;border-radius:7px;box-shadow:0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.opt.on .box{background:var(--ink);color:#fff;box-shadow:none}
.row7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}.row7 .ch{min-height:62px;font-size:16px}
.picks{display:grid;gap:10px;margin-top:18px}
.pk{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1.5px var(--line)}
.pk .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.pk b{display:block;font-size:19px;font-weight:800}.pk small{font-size:13px;font-weight:700;color:var(--ink3)}
.pk:active{box-shadow:0 0 0 2.5px var(--ink)}
.bars h3{font-size:13px;font-weight:800;color:var(--ink3);margin:14px 0 6px}.bars h3:first-child{margin-top:0}
.br{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:4px 0;font-size:14px;font-weight:700}
.br .tr{display:block;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}.br .tr i{display:block;height:100%;border-radius:6px}
.br b{text-align:right;font-size:16px}.br em{grid-column:2/4;grid-row:1;font-style:normal;font-size:12px;font-weight:700;color:var(--down);padding-left:4px}
.zt{display:flex;align-items:center;gap:10px}.zt i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800}.zt b{font-size:19px;font-weight:800}
.cnote{background:#FFFBF2;box-shadow:0 0 0 1px #F2E3C6}.cnote h2{color:#9A6B16}.cnote p{font-size:16px;line-height:1.6}
.cnote h3{font-size:14px;font-weight:800;margin-top:12px}.cnote h3+p{font-size:15px;color:var(--ink2);margin-top:2px}
.badge{display:inline-block;font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px}.badge.ok{background:#ECFDF3;color:#067647}.badge.wait{background:#FFFAEB;color:#B54708}
.ml{list-style:decimal;padding-left:18px;margin-top:4px}.ml li{font-size:14px;color:var(--ink2);line-height:1.55;padding:1px 0;border:0;display:list-item}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .btn{min-height:52px;font-size:15px;margin-top:12px}
.ponly{display:none}
.conds{display:grid;gap:10px;margin-top:16px}
.cond{padding:16px 18px;border-radius:20px}.cond small{font-size:12px;font-weight:800;letter-spacing:.04em}.cond b{display:block;font-size:19px;font-weight:800;margin-top:2px}.cond p{font-size:15px;color:var(--ink2);line-height:1.55;margin-top:4px}
.kv.wide{grid-template-columns:minmax(0,1fr) auto}.kv.wide dt{color:var(--ink2);font-weight:600}
.days7{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.dy7{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.dy7 span{font-size:11px;font-weight:800;color:var(--ink3)}.dy7 b{font-size:16px;font-weight:800}.dy7 em{font-style:normal;font-size:13px;font-weight:700;color:var(--ink3)}
.dy7.done{background:var(--ink);box-shadow:none}.dy7.done b{color:#fff}.dy7.done em,.dy7.done span{color:#C9CED6}.dy7[disabled]{opacity:.45}
.chips2{display:flex;flex-wrap:wrap;gap:6px}.chips2 button{height:40px;padding:0 14px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:700;color:var(--ink2)}.chips2 button.on{background:var(--ink);color:#fff}
.ov{position:fixed;inset:0;background:rgba(14,17,22,.6);z-index:20;display:grid;place-items:center;padding:20px}
.ovb{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--bg);border-radius:22px;padding:16px}.ovb img{width:100%;border-radius:12px;display:block;box-shadow:0 0 0 1px var(--line)}.ovb .btn{min-height:52px;margin-top:10px}
@media print{body{background:#fff}body *{visibility:hidden}#routine,#routine *{visibility:visible}#routine{position:absolute;left:0;top:0;width:100%;box-shadow:none;margin:0}.ponly{display:block}}
.qs{font-size:13px;font-weight:600;color:var(--ink3);margin-left:6px}
.ends span:nth-child(2){text-align:center}
.tabs3.four{grid-template-columns:repeat(4,1fr)}.tabs3.four button{font-size:14px}
.rpnavw{position:relative;margin:10px -20px 16px}.rpnavw .rpnav{margin:0;padding:0 20px 2px;cursor:grab}
.rpnavw::before,.rpnavw::after{content:"";position:absolute;top:0;bottom:2px;width:44px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1}
.rpnavw::before{left:0;background:linear-gradient(90deg,var(--bg) 35%,transparent)}.rpnavw::after{right:0;background:linear-gradient(270deg,var(--bg) 35%,transparent)}
.rpnavw.more-l::before,.rpnavw.more-r::after{opacity:1}
.rpar{position:absolute;top:1px;width:32px;height:32px;border-radius:50%;background:var(--card);box-shadow:0 1px 4px rgba(14,17,22,.18);display:none;place-items:center;font-size:20px;font-weight:800;line-height:1;color:var(--ink);z-index:2;text-align:center}
.rpar.l{left:6px}.rpar.r{right:6px}.rpnavw.more-l .rpar.l,.rpnavw.more-r .rpar.r{display:grid}
.bars h3 .dl{font-style:normal;font-size:13px;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--ink2)}.bars h3 .dl.up{background:#ECFDF3;color:#067647}.bars h3 .dl.down{background:var(--down-w);color:var(--down)}
.why0{font-size:20px;font-weight:800;margin-top:22px}
.why{margin-top:10px;padding:16px 18px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line);border-left:5px solid}
.why .wt{font-size:16px;font-weight:800}.why .wm{font-size:13px;font-weight:700;color:var(--ink3);margin:2px 0 6px}
.why p{font-size:15px;line-height:1.6;color:var(--ink2)}.why p+p{margin-top:6px}.why .wh{color:var(--down);font-weight:600}
/* result */
.step{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin-top:26px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fact{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.fact small{display:block;font-size:12px;font-weight:700;color:var(--ink3)}
.fact b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.fact.wide{grid-column:1/-1}
.read{margin-top:10px;padding:18px 20px;border-radius:20px;background:var(--ink);color:#fff;font-size:18px;font-weight:700;line-height:1.55}
.read p+p{margin-top:8px;font-size:15px;color:#E3C9A8}
.rec .zt{display:flex;align-items:center;gap:10px}
.rec .zt i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800}
.rec .zt b{font-size:22px;font-weight:800}
.kv{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px;margin-top:12px;font-size:15px;line-height:1.5}
.kv dt{font-weight:700;color:var(--ink3)}.kv dd{margin:0;font-weight:700}
.list li{position:relative;padding:6px 0 6px 16px;font-size:15px;color:var(--ink2);line-height:1.5}
.list li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.week{display:grid;gap:6px;margin-top:10px}
.week div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:14px;line-height:1.45}
.week b{font-weight:800}
.ask{margin-top:26px;padding:22px 20px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.ask h3{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
.ask .btn{margin-top:14px}
.choice{display:grid;gap:8px;margin-top:14px}
.center{flex:1;display:grid;place-items:center;color:var(--ink3)}
.fade{animation:f .22s ease}@keyframes f{from{transform:translateY(6px)}to{transform:none}}
@media (min-width:520px){body{background:#E9EBEF}#app{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){.fade,.dot{animation:none!important}}

  const act = (f.kinds || []).length > 0, cid = f.cid || 'd' + f.day; if (act) f.kind = f.kinds.length === 1 ? f.kinds[0] : 'mixed';
  const args = { p_key: S.key, p_cid: cid, p_day: f.day, p_kind: f.kind, p_slot: act ? f.slot : null, p_minutes: act ? f.minutes : null, p_mood0: act ? f.mood0 : null, p_energy0: act ? f.energy0 : null,
    p_mood1: act ? f.mood1 : null, p_energy1: act ? f.energy1 : null, p_rpe: act ? f.rpe : null, p_again: act ? f.again : null, p_note: (f.note || '').trim().slice(0, 200), p_delete: !!del, p_kinds: act ? f.kinds : null };
  if (PV) { const L2 = S.st.me.logs = (S.st.me.logs || []).filter((l) => l.day !== f.day); if (!del) L2.push(Object.assign({}, f, { cid })); S.logf = null; render(true); return; }
  S.busy = true; S.err = null; render();
  try { setState(await rpc('v15_log', args)); S.logf = null; try { history.back(); } catch (_) {} }
  catch (e) { S.err = e.net ? '연결이 불안정해요. 다시 눌러 주세요.' : '저장하지 못했어요. 날짜를 확인해 주세요.'; }
  S.busy = false; render(true); window.scrollTo(0, 0);
}
document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset;
  if (d.act === 'go-survey') { S.page = 'name'; S.err = null; render(); window.scrollTo(0, 0); }
  else if (d.act === 'to-intro') { S.page = 'intro'; S.err = null; render(); }
  else if (d.sv) { S.sv.a[d.sv] = +d.v; S.err = null; render(); setTimeout(svNext, 170); }
  else if (d.svm) { const k = d.svm, v = +d.v, cur = Array.isArray(S.sv.a[k]) ? S.sv.a[k].slice() : []; const i = cur.indexOf(v); if (i >= 0) cur.splice(i, 1); else cur.push(v); S.sv.a[k] = cur.sort((x, y) => x - y); LS.set('sv2.' + slug, S.sv); render(); }
  else if (d.svs) { S.sv.a[d.svs] = +d.v; LS.set('sv2.' + slug, S.sv); render(); }
  else if (d.act === 'sv-next') svNext();
  else if (d.act === 'sv-back') { if (S.sv.i > 0) { S.sv.i--; LS.set('sv2.' + slug, S.sv); S.err = null; render(); } else { S.err = null; render(); } }
  else if (d.act === 'pain-none') { S.sv.a.pain = ''; svNext(); }
  else if (d.act === 'pain-next') { const ta = $('textarea[name=pain]'); S.sv.a.pain = ta ? ta.value.trim().slice(0, 160) : ''; svNext(); }
  else if (d.pre || d.post) { const w = d.pre ? 'pre' : 'post'; S[w][d.pre || d.post] = +d.v; render(); if (S[w].mood && S[w].energy) setTimeout(() => saveMood(w), 250); }
  else if (d.act === 'fin') { S.fin[+d.v] = true; LS.set('fin.' + slug, S.fin); render(); window.scrollTo(0, 0); }
  else if (d.act === 'unfin') { delete S.fin[+d.v]; LS.set('fin.' + slug, S.fin); S.ck = { enjoy: null, rpe: null, again: null }; render(); }
  else if (d.ck) {
    S.ck[d.ck] = +d.v; S.err = null; render();
    if (S.ck.enjoy && S.ck.rpe && S.ck.again) {
      const ri = roundInfo(), r = ri.due || ri.running, rec = { round: r, enjoy: S.ck.enjoy, rpe: S.ck.rpe, again: S.ck.again };
      setTimeout(async () => {
        S.ck = { enjoy: null, rpe: null, again: null }; window.scrollTo(0, 0);
        if (PV) { S.st.me.checks.push(Object.assign({ station: S.st.me.ord[r - 1] }, rec)); S.st.class.phase = 'c' + r; render(); return; }
        S.pending = rec; LS.set('pend.' + slug, rec); render(); await flushPending(); render();
      }, 250);
    }
  }
  else if (d.pick) {
    if (PV) { S.st.me.ord = S.st.me.ord.slice(0, 3).concat(d.pick); render(); return; }
    S.busy = true; S.err = null; render();
    try { setState(await rpc('v15_pick', { p_key: S.key, p_station: d.pick })); } catch (e) { S.err = e.code === 'not_yet' ? '세 번째 운동 기록이 저장된 뒤 고를 수 있어요. 잠시 후 다시 눌러 주세요.' : e.net ? '연결이 불안정해요. 다시 눌러 주세요.' : '고르지 못했어요. 다시 눌러 주세요.'; }
    S.busy = false; render(); window.scrollTo(0, 0);
  }
  else if (d.rp != null && d.rp !== '') goPage(+d.rp);
  else if (d.lib) { S.lib = d.lib; render(); }
  else if (d.act === 'nav-l' || d.act === 'nav-r') { const nv = $('.rpnav'); if (nv) nv.scrollLeft += (d.act === 'nav-l' ? -1 : 1) * nv.clientWidth * 0.7; navSync(false); }
  else if (d.act === 'save-img') { const me = S.st.me, R = routineOf(me, L.profile(me)); if (R) { try { S.ov = routineImage(me, R); } catch (_) { S.ov = null; } render(true); } }
  else if (d.act === 'close-ov') { S.ov = null; render(true); }
  else if (d.act === 'save-pdf') window.print();
  else if (d.sat) { S.sat[d.sat] = +d.v; S.err = null; render(); }
  else if (d.act === 'sat-send') {
    keepText(); const data = Object.assign({}, S.sat, { best: (S.txt.best || '').trim(), improve: (S.txt.improve || '').trim() });
    if (PV) { S.st.me.satisfaction = data; render(true); return; }
    S.busy = true; S.err = null; render();
    try { setState(await rpc('v15_satisfaction', { p_key: S.key, p_data: data })); window.scrollTo(0, 0); } catch (e) { S.err = e.net ? '연결이 불안정해요. 다시 눌러 주세요.' : '보내지 못했어요. 다시 눌러 주세요.'; }
    S.busy = false; render(true);
  }
  else if (d.logday) openLog(d.logday);
  else if (d.lf) { if (!S.logf) return; const k = d.lf; S.logf[k] = k === 'kind' || k === 'slot' ? d.v : +d.v; if (k === 'kind') S.logf.kinds = []; S.err = null; render(); }
  else if (d.lk) { if (!S.logf) return; const a = (S.logf.kinds || []).slice(), i = a.indexOf(d.lk); if (i >= 0) a.splice(i, 1); else a.push(d.lk); S.logf.kinds = a; S.logf.kind = a.length ? (a.length === 1 ? a[0] : 'mixed') : null; S.err = null; render(); }
  else if (d.act === 'log-save') saveLog(false);
  else if (d.act === 'log-del') saveLog(true);
  else if (d.act === 'log-close') { S.logf = null; S.err = null; try { if (history.state && history.state.cpLog) history.back(); } catch (_) {} render(true); }
  else if (d.act === 'ask') { S.ask = true; if (S.st) S.st.me.interest = null; render(); }
  else if (d.interest) { S.ask = false; if (PV) { S.st.me.interest = d.interest; render(); return; } try { setState(await rpc('v15_interest', { p_key: S.key, p_choice: d.interest })); } catch (_) { S.st.me.interest = d.interest; } render(); }
});
document.addEventListener('input', (ev) => { const el = ev.target; if (el.name === 'phone') el.value = el.value.replace(/\D/g, '').slice(0, 4); if (el.name in S.f) S.f[el.name] = el.value; });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.name === 'name') { ev.preventDefault(); const p = $('input[name=phone]'); if (p) p.focus(); } });
document.addEventListener('submit', async (ev) => {
  ev.preventDefault(); if (S.busy) return;
  const name = S.f.name.trim().replace(/\s+/g, ' '), phone = S.f.phone.trim();
  if (!name) { S.err = '이름을 입력해 주세요.'; render(); return; }
  if (!/^\d{4}$/.test(phone)) { S.err = '전화번호 뒷 4자리를 숫자로 입력해 주세요.'; render(); return; }
  if (PV) { S.key = 'preview'; S.st = mock('survey'); S.st.me.name = name; render(); return; }
  S.busy = true; S.err = null; render();
  let out = null, err = null;
  for (let i = 0; i < 3 && !out; i++) { try { out = await rpc('v15_join', { p_class: slug, p_name: name, p_phone4: phone }); } catch (e) { err = e; if (!e.net) break; await new Promise((r) => setTimeout(r, 900 * (i + 1))); } }
  S.busy = false;
  if (out) { S.key = out.key; LS.set('key.' + slug, S.key); S.sv = { i: 0, a: {} }; LS.set('sv2.' + slug, S.sv); S.fin = {}; LS.set('fin.' + slug, S.fin); setState(out.state); window.scrollTo(0, 0); }
  else S.err = err && err.code === 'class_not_found' ? '수업을 찾을 수 없어요. 링크를 다시 확인해 주세요.' : err && err.code === 'rate_limited' ? '잠시 후 다시 시도해 주세요.' : '연결이 불안정해요. 다시 눌러 주세요.';
  render();
});
// result pages live in the browser history, so the phone's back button steps back a page and a trip to YouTube comes back to the same page
function goPage(n) { S.rp = n; S.logf = null; S.err = null; LS.set('rp.' + slug, n); try { history.pushState({ cpPage: n }, ''); } catch (_) {} render(); window.scrollTo(0, 0); }
addEventListener('popstate', (e) => { if (!S.st || !S.st.me || S.st.me.mood1 == null) return; S.logf = null; S.rp = e.state && e.state.cpPage != null ? e.state.cpPage : 0; LS.set('rp.' + slug, S.rp); render(true); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
setInterval(() => { if (SIM || document.visibilityState === 'visible') render(); }, 1000);
setInterval(() => { if (SIM || document.visibilityState === 'visible') poll(); }, SIM ? 800 : 3000);
render(true); poll();
})();
