<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222.5%22%20fill%3D%22%2315171A%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2220.5%22%20fill%3D%22%23567AFF%22%2F%3E%3Cg%20transform%3D%22rotate(22%2050%2050)%22%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2250%22%20rx%3D%2239%22%20ry%3D%2212.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>컨디션 플래닛 · 원데이클래스</title>
<style>
:root{--bg:#F6F7F9;--card:#fff;--ink:#0E1116;--ink2:#4A5160;--ink3:#8B93A1;--line:#E6E8EC;--soft:#EEF0F3;--down:#C2341A;--down-w:#FFE9E5;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;text-align:left}
input{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
.n{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 12px) 20px calc(var(--sab) + 28px)}
/* app bar + journey */
.bar{display:flex;align-items:center;gap:8px;height:36px;font-weight:700;font-size:14px}
.bar .pill{font-size:11px;font-weight:700;color:var(--ink2);background:var(--soft);padding:3px 8px;border-radius:999px}
.bar .net{margin-left:auto;font-size:12px;color:var(--down);font-weight:600;display:none}.bar .net.on{display:block}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 22px}
.journey i{height:4px;border-radius:2px;background:var(--line);display:block}
.journey i.on{background:var(--ink)}
.journey span{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink3);margin-top:4px}
.journey span b{color:var(--ink);font-weight:700}
/* type */
.eyebrow{font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.h1{font-size:28px;line-height:1.3;font-weight:800;letter-spacing:-.025em;margin-top:8px;white-space:pre-line}
.sub{font-size:15px;color:var(--ink2);margin-top:10px;line-height:1.6}
.note{font-size:13px;color:var(--ink3);line-height:1.55}
.grow{flex:1}
/* cards */
.card{background:var(--card);border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 1px 2px rgba(14,17,22,.04),0 0 0 1px var(--line)}
.card h2{font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:12px;letter-spacing:.01em}
/* join */
.field{display:block;margin-top:16px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.field input{width:100%;height:60px;padding:0 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:18px;font-weight:600;outline:none}
.field input:focus{border-color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border-radius:18px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;margin-top:18px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line)}
.err{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--down-w);color:var(--down);font-size:14px;font-weight:600}
/* wizard */
.wz-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.wz-top button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-left:-10px;color:var(--ink2)}
.wz-top span{font-size:13px;font-weight:700;color:var(--ink3)}
.badge{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border-radius:999px;font-weight:800;font-size:15px}
.badge .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:0 18px;background:var(--card);border-radius:18px;font-size:18px;font-weight:700;box-shadow:0 0 0 1.5px var(--line);transition:transform .08s,box-shadow .12s}
.opt:active{transform:scale(.985)}
.opt.on{box-shadow:0 0 0 2.5px var(--ink)}
.opt small{display:block;font-size:13px;font-weight:500;color:var(--ink3)}
.opt .em{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
/* wait / team */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#12B76A;animation:p 1.5s infinite}@keyframes p{50%{opacity:.25}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--soft);border-radius:14px;padding:12px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--ink2)}
.sum b{display:block;font-size:22px;font-weight:800;color:var(--ink)}
.prefs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.hero{border-radius:26px;padding:24px 22px;color:#fff;margin-top:6px;position:relative;overflow:hidden}
.hero .k{font-size:13px;font-weight:700;opacity:.85}
.hero .t{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.mates{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.mate{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px 5px 5px;font-weight:700;font-size:14px}
.mate i{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.route{display:grid;gap:0}
.stop{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;position:relative}
.stop .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;position:relative;z-index:1}
.stop:not(:last-child)::after{content:"";position:absolute;left:21px;top:54px;bottom:-10px;width:2px;background:var(--line)}
.stop b{font-size:17px;font-weight:800;display:block}.stop small{font-size:13px;color:var(--ink3);font-weight:600}
.stop .st{font-size:12px;font-weight:700;color:var(--ink3)}
.stop.done .ic{background:var(--soft)!important;color:var(--ink3)}.stop.done b{color:var(--ink3)}
.why{font-size:15px;line-height:1.65;color:var(--ink2)}
/* round */
.ring{position:relative;width:208px;height:208px;margin:18px auto 6px}
.ring>svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .time{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .lab{font-size:13px;font-weight:700;opacity:.85;margin-top:4px}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--soft);font-size:15px;line-height:1.5}
.steps li:first-child{border-top:0}
.steps i{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--ink2)}
.nextup{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:700}
.nextup .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff}
.nextup small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
/* check */
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:16px;font-size:12px;font-weight:700;color:var(--ink2);text-align:center}
.fbtn.on{background:var(--ink);color:#fff}
.fbtn.on svg rect[fill="#0E1116"]{fill:#fff}.fbtn.on svg rect[fill="#D9DDE4"]{fill:#4A5160}
.q+.q{margin-top:22px}
.q>b{display:block;font-size:17px;font-weight:800;margin-bottom:10px}
/* report */
.delta{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:24px;padding:0 8px;border-radius:8px;font-size:13px;font-weight:800;background:var(--soft);color:var(--ink2)}
.delta.up{background:var(--ink);color:#fff}.delta.down{background:var(--down-w);color:var(--down)}
.ba{display:flex;align-items:center;gap:14px;margin-top:16px}
.ba .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ba .arr{color:var(--ink3)}
.kv{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.blk{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--soft)}
.blk:first-of-type{border-top:0}
.blk .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff}
.blk b{font-weight:800;font-size:16px;display:block}.blk small{font-size:12px;color:var(--ink3);font-weight:600}
.blk .c{text-align:center;font-size:11px;color:var(--ink3);font-weight:700}
.find li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--soft)}.find li:first-child{border-top:0;padding-top:0}
.find i{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--ink3)}.find .good i{background:#12B76A}.find .bad i{background:var(--down)}
.find b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.45}.find span{font-size:13px;color:var(--ink2)}
.day{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0}
.day .d{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.day .t{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.seq{display:flex;gap:3px;height:34px}
.seq span{border-radius:9px;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rule{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;line-height:1.55}
.out li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--soft);font-size:15px;line-height:1.55}.out li:first-child{border-top:0}
.out li svg{margin-top:2px}
.cta{position:sticky;bottom:calc(var(--sab) + 10px);margin-top:18px;z-index:3}
.cta .btn{margin:0;box-shadow:0 10px 30px rgba(14,17,22,.25)}
.center{flex:1;display:grid;place-items:center;color:var(--ink3)}
.fade{animation:f .28s ease both}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width:520px){body{background:#E9EBEF}#app{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"><div class="center">…</div></div>
<script>
/* Condition Planet V1.5 — one-day class logic (shared by the member page and the coach page).
   assign(): puts people with similar preferences and condition in the same team and gives each team an order of the three stations.
   report(): turns one person's start state + three checks into findings, a one-week plan and a cautious one-month outlook. */
(function (g) {
'use strict';
const ST = { cardio: { ko: '유산소', c: '#FF6A3D', w: '#FFEEE7' }, weights: { ko: '웨이트', c: '#3D5AFE', w: '#E9EDFF' }, stretch: { ko: '스트레칭', c: '#0FA37A', w: '#E2F6EF' } };
const KEYS = ['cardio', 'weights', 'stretch'];
const TEAMS = [
  { id: 1, name: '달리기 팀', ord: ['cardio', 'weights', 'stretch'], line: '심박을 먼저 올리고, 힘을 쓰고, 풀면서 끝냅니다.' },
  { id: 2, name: '힘쓰기 팀', ord: ['weights', 'stretch', 'cardio'], line: '힘이 있을 때 먼저 들고, 풀어 준 뒤, 유산소로 끝냅니다.' },
  { id: 3, name: '깨우기 팀', ord: ['stretch', 'cardio', 'weights'], line: '몸을 먼저 깨우고, 심박을 올린 뒤, 마지막에 힘을 씁니다.' },
];
const jong = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 : 0; };
const ro = (w) => w + (jong(w) === 0 || jong(w) === 8 ? '로' : '으로');
const un = (w) => w + (jong(w) ? '은' : '는');
const sg = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const lowCount = (m) => (m.energy0 <= 2 ? 1 : 0) + (m.body0 <= 2 ? 1 : 0) + (m.mood0 <= 2 ? 1 : 0);

// how well a station order fits one person right now
function score(m, t) {
  const p = m.pref || {}, first = t.ord[0], last = t.ord[2], low = lowCount(m);
  let s = 1.5 * (p[first] || 0) + 0.5 * (p[last] || 0);
  if (first === 'stretch') s += 1.2 * low;
  if (first === 'cardio') s += (m.energy0 >= 4 ? 1 : 0) - 0.8 * low;
  if (first === 'weights') s += (m.energy0 >= 4 && m.body0 >= 3 ? 0.8 : 0) - (m.body0 <= 2 ? 1.2 : 0) - 0.4 * low;
  return s;
}
const bestTeam = (m) => TEAMS.slice().sort((a, b) => score(m, b) - score(m, a))[0];
function reason(m, t) {
  const p = m.pref || {}, low = lowCount(m), first = ST[t.ord[0]].ko;
  const state = low >= 2 ? `지금 에너지 ${m.energy0}, 몸 상태 ${m.body0}로 낮은 편이라` : m.energy0 >= 4 ? `에너지가 ${m.energy0}로 충분해서` : '컨디션이 무난해서';
  let s = low >= 2 && t.ord[0] !== 'stretch' && bestTeam(m) !== t
    ? `오늘은 세 명씩 팀을 맞추느라 ${ro(first)} 시작합니다. 지금 에너지 ${m.energy0}, 몸 상태 ${m.body0}로 낮은 편이니 첫 블록은 평소보다 가볍게 하세요.`
    : `${state} ${ro(first)} 시작합니다. ${t.line}`;
  const dis = KEYS.filter((k) => p[k] < 0), like = KEYS.filter((k) => p[k] > 0);
  dis.forEach((k) => { const i = t.ord.indexOf(k); s += ` 싫어한다고 고른 ${un(ST[k].ko)} ${['맨 먼저 끝내도록 앞에', '몸이 풀린 가운데에', '마지막에'][i]} 넣었습니다.`; });
  if (dis.length) s += ' 하고 난 뒤 기분이 어떻게 변하는지 보는 것이 오늘의 실험입니다.';
  else if (like.length) s += ` 좋아하는 ${like.map((k) => ST[k].ko).join('·')}${like.length ? '도' : ''} 숫자로 확인해 봅니다.`;
  return s;
}
// Best total fit with balanced team sizes (exhaustive search; a class is small)
function assign(members) {
  const n = members.length; if (!n) return [];
  const hi = Math.ceil(n / 3), lo = n >= 3 ? Math.floor(n / 3) : 0, sc = members.map((m) => TEAMS.map((t) => score(m, t)));
  const maxRest = new Array(n + 1).fill(0); for (let i = n - 1; i >= 0; i--) maxRest[i] = maxRest[i + 1] + Math.max(...sc[i]);
  let best = null, bestV = -1e9; const cur = new Array(n), cnt = [0, 0, 0];
  (function go(i, v) {
    if (v + maxRest[i] <= bestV) return;
    if (i === n) { if (cnt.every((c) => c >= lo)) { bestV = v; best = cur.slice(); } return; }
    for (let t = 0; t < 3; t++) { if (cnt[t] >= hi) continue; cnt[t]++; cur[i] = t; go(i + 1, v + sc[i][t]); cnt[t]--; }
  })(0, 0);
  if (!best) best = members.map((m) => TEAMS.indexOf(bestTeam(m)));
  return members.map((m, i) => { const t = TEAMS[best[i]]; return { id: m.id, team: t.id, ord: t.ord, kind: t.name, reason: reason(m, t) }; });
}
const one = (m) => { const t = bestTeam(m); return { id: m.id, team: t.id, ord: t.ord, kind: t.name, reason: reason(m, t) }; };

function rows(m) {
  const ch = (m.checks || []).slice().sort((a, b) => a.round - b.round); let pm = m.mood0, pb = m.body0;
  return ch.map((c) => { const r = { round: c.round, st: c.station, m0: pm, m1: c.mood, b0: pb, b1: c.body, dm: c.mood - pm, db: c.body - pb, pref: (m.pref || {})[c.station] || 0 }; pm = c.mood; pb = c.body; return r; });
}
function report(m) {
  const R = rows(m); if (R.length < 3) return null;
  const end = R[2], dmT = end.m1 - m.mood0, dbT = end.b1 - m.body0, name = (k) => ST[k].ko;
  const byMood = R.slice().sort((a, b) => b.dm - a.dm || b.db - a.db), byBody = R.slice().sort((a, b) => b.db - a.db || b.dm - a.dm), best = byMood[0];
  const F = [];
  F.push({ tone: dmT > 0 ? 'good' : dmT < 0 ? 'bad' : 'info', text: `45분 동안 기분 ${m.mood0} → ${end.m1}, 몸 상태 ${m.body0} → ${end.b1}.`, ev: `기분 ${sg(dmT)} · 몸 ${sg(dbT)}` });
  const even = best.dm > 0 && byMood[2].dm === best.dm;
  if (even) F.push({ tone: 'good', text: `세 블록 모두 기분이 ${sg(best.dm)}씩 올랐습니다.`, ev: '오늘의 순서 자체가 잘 맞았습니다.' });
  else if (best.dm > 0) F.push({ tone: 'good', text: `기분이 가장 많이 오른 건 ${name(best.st)} 15분이었습니다.`, ev: `${name(best.st)} 전 ${best.m0} → 후 ${best.m1} (${sg(best.dm)})` });
  else F.push({ tone: 'info', text: '오늘은 어느 블록에서도 기분이 뚜렷하게 오르지 않았습니다.', ev: '순서와 시간을 바꿔 가며 맞는 조합을 찾아야 하는 날입니다.' });
  R.forEach((r) => {

}
function vRound(ri) {

  return `<div><div class="hero" style="background:${ST[k].c};text-align:center;padding-bottom:20px"><p class="k">${r}번째 블록 · ${esc(me.kind)}</p>
    <div class="ring"><svg width="208" height="208" viewBox="0 0 208 208"><circle cx="104" cy="104" r="94" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="10"/><circle id="arc" cx="104" cy="104" r="94" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/></svg>
      <div class="in"><div>${UI.icon(k, 30)}<div class="time n" id="timer">${clock(ri.left)}</div><div class="lab">${ST[k].ko}</div></div></div></div>

}
function vCheck(ri) {
  const me = S.st.me, r = ri.due, k = me.ord[r - 1];
  return `<div class="fade"><p class="eyebrow"><span style="display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;color:#fff;background:${ST[k].c}">${UI.icon(k, 14)}</span>${r}번째 체크 · 두 번만 누르면 끝</p>
  <h1 class="h1">${ST[k].ko} ${S.st.class.minutes}분 끝.\n지금은 어떤가요?</h1>
  <div class="card"><div class="q"><b>기분</b><div class="five">${[1, 2, 3, 4, 5].map((v) => `<button class="fbtn${S.ck.mood === v ? ' on' : ''}" data-set="cmood" data-v="${v}">${UI.face(v, 46)}<span>${MOOD_S[v]}</span></button>`).join('')}</div></div>
    <div class="q"><b>몸 상태</b><div class="five">${[1, 2, 3, 4, 5].map((v) => `<button class="fbtn${S.ck.body === v ? ' on' : ''}" data-set="cbody" data-v="${v}">${UI.bars(v, 40)}<span>${BODY_S[v] || '&nbsp;'}</span></button>`).join('')}</div></div></div>
  ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}<p class="note" style="text-align:center;margin-top:14px">둘 다 누르면 자동으로 저장됩니다.</p></div>`;
}
function vBetween(ri) {
  const me = S.st.me, next = me.ord[ri.started];
  return `<div class="fade"><p class="eyebrow"><span class="dot"></span>기록했습니다</p>
  ${next ? `<h1 class="h1">다음은 ${ST[next].ko}.\n구역으로 이동해 주세요.</h1><div class="hero" style="background:${ST[next].c};margin-top:18px;display:flex;align-items:center;gap:14px">${UI.icon(next, 40)}<div><p class="k">${ri.started + 1}번째 블록</p><p class="t" style="font-size:28px">${ST[next].ko}</p></div></div>` : `<h1 class="h1">수고하셨습니다.\n잠시만 기다려 주세요.</h1>`}
  <div class="card"><h2>오늘의 순서</h2>${routeHtml(me, ri)}</div><p class="note" style="text-align:center;margin-top:16px">코치가 다음 블록을 시작하면 자동으로 넘어갑니다.</p></div>`;
}
function chart(me, R) {
  const W = 400, H = 190, Lp = 16, Rp = 16, Tp = 26, Bp = 44, pts = [{ lab: '시작', m: me.mood0, b: me.body0 }].concat(R.rows.map((r) => ({ lab: ST[r.st].ko, m: r.m1, b: r.b1, k: r.st })));
  const x = (i) => Lp + 22 + i * ((W - Lp - Rp - 44) / 3), y = (v) => Tp + ((5 - v) / 4) * (H - Tp - Bp);
  let g = [1, 3, 5].map((v) => `<line x1="${Lp}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF0F3"/>`).join('');
  g += `<polyline fill="none" stroke="#B8BEC9" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" points="${pts.map((p, i) => x(i) + ',' + y(p.b)).join(' ')}"/><polyline fill="none" stroke="#0E1116" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p, i) => x(i) + ',' + y(p.m)).join(' ')}"/>`;
  pts.forEach((p, i) => {
    const col = p.k ? ST[p.k].c : '#0E1116', above = p.m >= p.b;
    g += `<circle cx="${x(i)}" cy="${y(p.b)}" r="4" fill="#fff" stroke="#B8BEC9" stroke-width="2.5"/><circle cx="${x(i)}" cy="${y(p.m)}" r="7" fill="${col}" stroke="#fff" stroke-width="3"/>
      <text x="${x(i)}" y="${y(p.m) + (above ? -14 : 24)}" text-anchor="middle" font-size="15" font-weight="800" fill="#0E1116">${p.m}</text>
      <text x="${x(i)}" y="${H - 18}" text-anchor="middle" font-size="12" font-weight="700" fill="${p.k ? col : '#8B93A1'}">${p.lab}</text>`;
  });
  return `<div class="legend"><span><i style="background:#0E1116"></i>기분</span><span><i style="background:#B8BEC9"></i>몸 상태</span><span style="color:var(--ink3);font-weight:600">1 바닥 ~ 5 최고</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="블록별 기분과 몸 상태 변화">${g}</svg>`;
}
function vReport() {
  const me = S.st.me, R = L.report(me), end = R.rows[2];
  return `<div class="fade"><p class="eyebrow">${esc(me.name)}님의 오늘 · ${esc(me.kind)}</p><h1 class="h1">${esc(R.type)}</h1>
  <div class="card"><h2>45분 전과 지금</h2><div class="ba">${UI.face(me.mood0, 52)}<span class="big n">${me.mood0}</span><span class="arr">${UI.arrow}</span>${UI.face(end.m1, 52)}<span class="big n">${end.m1}</span></div>
    <div class="kv"><span class="tag">기분 ${delta(R.dmT)}</span><span class="tag">몸 상태 ${me.body0} → ${end.b1} ${delta(R.dbT)}</span></div></div>
  <div class="card"><h2>15분마다 무슨 일이 있었나</h2>${chart(me, R)}
    <div style="margin-top:6px">${R.rows.map((r) => `<div class="blk">${sic(r.st, 20)}<div><b>${ST[r.st].ko}</b><small>${r.pref > 0 ? '좋아한다고 고른 운동' : r.pref < 0 ? '싫어한다고 고른 운동' : '보통이라고 고른 운동'}</small></div><div class="c">기분<br>${delta(r.dm)}</div><div class="c">몸<br>${delta(r.db)}</div></div>`).join('')}</div></div>
  <div class="card"><h2>숫자가 말해 주는 것</h2><ul class="find">${R.findings.slice(1).map((f) => `<li class="${f.tone}"><i></i><div><b>${esc(f.text)}</b><span>${esc(f.ev)}</span></div></li>`).join('')}</ul></div>
  <div class="card"><h2>그래서, 이번 주는 이렇게</h2><div class="legend">${L.KEYS.map((k) => `<span><i style="background:${ST[k].c}"></i>${ST[k].ko}</span>`).join('')}</div>
    ${R.week.map((w) => { const tot = w.seq.reduce((a, s) => a + s.min, 0); return `<div class="day"><span class="d">${w.d}</span><div><div class="t">${esc(w.t)}</div><div class="seq" style="width:${Math.round((tot / 45) * 100)}%">${w.seq.map((s) => `<span style="flex:${s.min};background:${ST[s.st].c}">${s.min}분</span>`).join('')}</div></div></div>`; }).join('')}
    <p class="why" style="font-size:14px;margin-top:8px">${esc(R.why)}</p><div class="rule"><b>처진 날 규칙</b> · ${esc(R.rule)}</div></div>
  <div class="card"><h2>한 달 뒤에는</h2><ul class="out">${R.month.map((x) => `<li>${UI.check}<span>${esc(x)}</span></li>`).join('')}</ul><p class="note" style="margin-top:8px">오늘 하루 기록으로 만든 예상입니다. 한 달 기록이 쌓이면 실제 숫자로 바뀝니다.</p></div>
  ${me.want_v2 === true ? `<div class="card" style="text-align:center"><p style="font-size:18px;font-weight:800">한 달 프로그램을 신청했습니다.</p><p class="sub" style="margin-top:4px">코치가 따로 안내드립니다.</p><button class="btn ghost" data-act="optin" data-v="0">신청 취소</button></div>`
    : `<div class="card"><h2>한 달 프로그램</h2><p class="why">운동할 때마다 전·후 컨디션을 한 번씩만 남기면, 한 달 뒤 나에게 맞는 운동과 4주 플랜을 받습니다.</p></div><div class="cta"><button class="btn" data-act="optin" data-v="1">한 달 더 해 보고 싶어요</button></div>`}</div>`;
}
function stage() {            // 0 check-in · 1 team · 2-4 blocks · 5 report
  if (!S.key || !S.st) return -1; const me = S.st.me;
  if (!me.intake || !me.team) return 0; if (me.checks.length >= 3) return 5;
  const ri = roundInfo(); return ri.started === 0 ? 1 : Math.min(4, 1 + Math.max(ri.started, 1));
}
function view() {
  if (!S.key || !S.st) return vJoin();
  const me = S.st.me;
  if (!me.intake) return vIntake();
  if (!me.team) return vWait();
  const ri = roundInfo();
  if (ri.due) return vCheck(ri);
  if (me.checks.length >= 3) return vReport();
  if (ri.running && !ri.have(ri.running)) return vRound(ri);
  if (ri.started === 0) return vTeam(ri);
  return vBetween(ri);
}
function render(force) {
  const html = view(), sig = html.replace(/id="timer">[^<]*</, '').replace(/stroke-dashoffset="[^"]*"/, '') + S.net + S.busy;
  if (!force && sig === S.sig) {
    const t = $('#timer'); if (t && S.st) { const ri = roundInfo(), C = 2 * Math.PI * 94; t.textContent = clock(ri.left); const a = $('#arc'); if (a) a.setAttribute('stroke-dashoffset', (C * (1 - Math.max(0, Math.min(1, ri.left / ri.total)))).toFixed(1)); }
    return;
  }
  S.sig = sig;
  const st = stage(), names = ['체크', '팀', '1블록', '2블록', '3블록', '리포트'];
  $('#app').innerHTML = `<div class="bar">${UI.logo}<span>컨디션 플래닛</span><span class="pill">원데이클래스</span><span class="net${S.net ? '' : ' on'}">연결 재시도 중…</span></div>
    ${st >= 0 ? `<div class="journey">${names.map((_, i) => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}<span>${names.map((n, i) => (i === st ? `<b>${n}</b>` : `<span>${n}</span>`)).join('')}</span></div>` : '<div style="height:26px"></div>'}${html}`;
  document.querySelectorAll('form input').forEach((el) => { if (el.name in S.f) el.value = S.f[el.name]; });
}
/* ---------- preview (no network): lets anyone look at every screen ---------- */
function mock(s) {
  const st = { class: { title: '헬스장에서 운동리듬 찾기', phase: 'intake', minutes: 15, routines: L.ROUTINES, started_ms: null, now_ms: Date.now() }, me: { name: '김지우', pref: null, mood0: null, body0: null, energy0: null, intake: false, team: null, ord: null, kind: null, reason: null, want_v2: null, checks: [] }, mates: [], joined: 7 }, me = st.me;
  const filled = () => Object.assign(me, { pref: { cardio: 1, weights: -1, stretch: 0 }, mood0: 2, body0: 2, energy0: 2, intake: true });
  const teamed = () => { filled(); const t = L.TEAMS[2]; Object.assign(me, { team: 3, ord: t.ord, kind: t.name, reason: L.reason(me, t) }); st.mates = ['박서준', '이도윤']; };
  if (s === 'wait') filled();
  if (s === 'team') { teamed(); st.class.phase = 'teams'; }
  if (s === 'round') { teamed(); st.class.phase = 'r1'; st.class.started_ms = Date.now() - 6 * 60000 - 12000; }
  if (s === 'check') { teamed(); st.class.phase = 'c1'; }
  if (s === 'between') { teamed(); st.class.phase = 'c1'; me.checks = [{ round: 1, station: 'stretch', mood: 3, body: 3 }]; }
  if (s === 'report') { teamed(); st.class.phase = 'done'; me.checks = [{ round: 1, station: 'stretch', mood: 3, body: 3 }, { round: 2, station: 'cardio', mood: 3, body: 3 }, { round: 3, station: 'weights', mood: 5, body: 4 }]; }
  return st;
}
if (PV) { if (PV === 'join') { S.key = null; S.st = null; } else { S.key = 'preview'; S.st = mock(PV === 'intake2' ? 'intake' : PV); S.in = PV === 'intake2' ? { step: 3, pref: { cardio: 1, weights: -1, stretch: 0 }, mood: null, body: null, energy: null } : { step: 0, pref: {}, mood: null, body: null, energy: null }; } S.pending = null; }

async function flushPending() {
  if (!S.pending || !S.key || PV) return;
  const p = S.pending;
  try { setState(await rpc('v15_check', { p_key: S.key, p_round: p.round, p_mood: p.mood, p_body: p.body })); S.pending = null; LS.del('pend.' + slug); }
  catch (e) { if (!e.net && e.code !== 'round_not_started') { S.pending = null; LS.del('pend.' + slug); S.err = '기록하지 못했어요. 다시 눌러 주세요.'; } }
}
async function poll() {
  if (PV) return;
  if (!S.key) { if (!S.pub) { try { S.pub = await rpc('v15_class_public', { p_class: slug }); } catch (_) {} render(); } return; }
  await flushPending();
  try { setState(await rpc('v15_state', { p_key: S.key })); }
  catch (e) { if (e.code === 'invalid_key') { S.key = null; S.st = null; LS.del('key.' + slug); LS.del('st.' + slug); } }
  render();
}
async function submitIntake() {
  if (S.busy) return; S.busy = true; S.err = null;
  if (PV) { S.st = mock('team'); S.busy = false; render(); window.scrollTo(0, 0); return; }
  try { setState(await rpc('v15_intake', { p_key: S.key, p_pref: S.in.pref, p_mood: S.in.mood, p_body: S.in.body, p_energy: S.in.energy })); window.scrollTo(0, 0); }
  catch (e) { S.err = e.net ? '연결이 불안정해요. 아래 버튼으로 다시 보내 주세요.' : '문제가 생겼어요. 다시 보내 주세요.'; }
  S.busy = false; render();
}
const stepOn = () => { LS.set('in.' + slug, S.in); render(); setTimeout(() => { if (S.in.step < 5) { S.in.step++; LS.set('in.' + slug, S.in); render(); window.scrollTo(0, 0); } else submitIntake(); }, 170); };
document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.pref) { S.in.pref[d.pref] = +d.v; stepOn(); }
  else if (d.set === 'mood' || d.set === 'body' || d.set === 'energy') { S.in[d.set] = +d.v; stepOn(); }
  else if (d.act === 'back') { S.in.step = Math.max(0, S.in.step - 1); S.err = null; render(); }
  else if (d.act === 'intake') submitIntake();
  else if (d.set === 'cmood' || d.set === 'cbody') {
    S.ck[d.set === 'cmood' ? 'mood' : 'body'] = +d.v; S.err = null; render();
    if (S.ck.mood && S.ck.body) {
      if (PV) { setTimeout(() => { S.st = mock('between'); S.ck = { mood: null, body: null }; render(); }, 200); return; }
      const ri = roundInfo(); S.pending = { round: ri.due, mood: S.ck.mood, body: S.ck.body }; LS.set('pend.' + slug, S.pending); S.ck = { mood: null, body: null }; render(); await flushPending(); render();
    }
  } else if (d.act === 'optin') { if (PV) { S.st.me.want_v2 = d.v === '1'; render(); return; } try { setState(await rpc('v15_optin', { p_key: S.key, p_yes: d.v === '1' })); } catch (_) {} render(); }
});
document.addEventListener('input', (ev) => { const el = ev.target; if (el.name === 'phone') el.value = el.value.replace(/\D/g, '').slice(0, 4); if (el.name in S.f) S.f[el.name] = el.value; });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.name === 'name') { ev.preventDefault(); const p = $('input[name=phone]'); if (p) p.focus(); } });
document.addEventListener('submit', async (ev) => {
  ev.preventDefault(); if (S.busy) return;
  const name = S.f.name.trim().replace(/\s+/g, ' '), phone = S.f.phone.trim();
  if (!name) { S.err = '이름을 입력해 주세요.'; render(); return; }
  if (!/^\d{4}$/.test(phone)) { S.err = '전화번호 뒷 4자리를 숫자로 입력해 주세요.'; render(); return; }
  if (PV) { S.key = 'preview'; S.st = mock('intake'); S.st.me.name = name; render(); return; }
  S.busy = true; S.err = null; render();
  let out = null, err = null;
  for (let i = 0; i < 3 && !out; i++) { try { out = await rpc('v15_join', { p_class: slug, p_name: name, p_phone4: phone }); } catch (e) { err = e; if (!e.net) break; await new Promise((r) => setTimeout(r, 900 * (i + 1))); } }
  S.busy = false;
  if (out) { S.key = out.key; LS.set('key.' + slug, S.key); S.in = { step: 0, pref: {}, mood: null, body: null, energy: null }; LS.set('in.' + slug, S.in); setState(out.state); window.scrollTo(0, 0); }
  else S.err = err && err.code === 'class_not_found' ? '수업을 찾을 수 없어요. 링크를 다시 확인해 주세요.' : err && err.code === 'rate_limited' ? '잠시 후 다시 시도해 주세요.' : '연결이 불안정해요. 다시 눌러 주세요.';
  render();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
setInterval(() => { if (document.visibilityState === 'visible') render(); }, 1000);
setInterval(() => { if (document.visibilityState === 'visible') poll(); }, 3000);
render(true); poll();
})();
