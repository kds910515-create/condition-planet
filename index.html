<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222.5%22%20fill%3D%22%2315171A%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2220.5%22%20fill%3D%22%23567AFF%22%2F%3E%3Cg%20transform%3D%22rotate(22%2050%2050)%22%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2250%22%20rx%3D%2239%22%20ry%3D%2212.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>컨디션 플래닛 · 원데이클래스</title>
<style>
:root{--bg:#F6F7F9;--card:#fff;--ink:#0E1116;--ink2:#4A5160;--ink3:#8B93A1;--line:#E6E8EC;--soft:#EEF0F3;--down:#C2341A;--down-w:#FFE9E5;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;text-align:left}
input{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
.n{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 12px) 20px calc(var(--sab) + 28px)}
/* app bar + journey */
.bar{display:flex;align-items:center;gap:8px;height:36px;font-weight:700;font-size:14px}
.bar .pill{font-size:11px;font-weight:700;color:var(--ink2);background:var(--soft);padding:3px 8px;border-radius:999px}
.bar .net{margin-left:auto;font-size:12px;color:var(--down);font-weight:600;display:none}.bar .net.on{display:block}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 22px}
.journey i{height:4px;border-radius:2px;background:var(--line);display:block}
.journey i.on{background:var(--ink)}
.journey span{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink3);margin-top:4px}
.journey span b{color:var(--ink);font-weight:700}
/* type */
.eyebrow{font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.h1{font-size:28px;line-height:1.3;font-weight:800;letter-spacing:-.025em;margin-top:8px;white-space:pre-line}
.sub{font-size:15px;color:var(--ink2);margin-top:10px;line-height:1.6}
.note{font-size:13px;color:var(--ink3);line-height:1.55}
.grow{flex:1}
/* cards */
.card{background:var(--card);border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 1px 2px rgba(14,17,22,.04),0 0 0 1px var(--line)}
.card h2{font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:12px;letter-spacing:.01em}
/* join */
.field{display:block;margin-top:16px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.field input{width:100%;height:60px;padding:0 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:18px;font-weight:600;outline:none}
.field input:focus{border-color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border-radius:18px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;margin-top:18px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line)}
.err{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--down-w);color:var(--down);font-size:14px;font-weight:600}
/* wizard */
.wz-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.wz-top button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-left:-10px;color:var(--ink2)}
.wz-top span{font-size:13px;font-weight:700;color:var(--ink3)}
.badge{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border-radius:999px;font-weight:800;font-size:15px}
.badge .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:0 18px;background:var(--card);border-radius:18px;font-size:18px;font-weight:700;box-shadow:0 0 0 1.5px var(--line);transition:transform .08s,box-shadow .12s}
.opt:active{transform:scale(.985)}
.opt.on{box-shadow:0 0 0 2.5px var(--ink)}
.opt small{display:block;font-size:13px;font-weight:500;color:var(--ink3)}
.opt .em{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
/* wait / team */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#12B76A;animation:p 1.5s infinite}@keyframes p{50%{opacity:.25}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--soft);border-radius:14px;padding:12px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--ink2)}
.sum b{display:block;font-size:22px;font-weight:800;color:var(--ink)}
.prefs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.hero{border-radius:26px;padding:24px 22px;color:#fff;margin-top:6px;position:relative;overflow:hidden}
.hero .k{font-size:13px;font-weight:700;opacity:.85}
.hero .t{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.mates{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.mate{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px 5px 5px;font-weight:700;font-size:14px}
.mate i{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.route{display:grid;gap:0}
.stop{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;position:relative}
.stop .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;position:relative;z-index:1}
.stop:not(:last-child)::after{content:"";position:absolute;left:21px;top:54px;bottom:-10px;width:2px;background:var(--line)}
.stop b{font-size:17px;font-weight:800;display:block}.stop small{font-size:13px;color:var(--ink3);font-weight:600}
.stop .st{font-size:12px;font-weight:700;color:var(--ink3)}
.stop.done .ic{background:var(--soft)!important;color:var(--ink3)}.stop.done b{color:var(--ink3)}
.why{font-size:15px;line-height:1.65;color:var(--ink2)}
/* round */
.ring{position:relative;width:208px;height:208px;margin:18px auto 6px}
.ring>svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .time{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .lab{font-size:13px;font-weight:700;opacity:.85;margin-top:4px}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--soft);font-size:15px;line-height:1.5}
.steps li:first-child{border-top:0}
.steps i{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--ink2)}
.nextup{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:700}
.nextup .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff}
.nextup small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
/* check */
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:16px;font-size:12px;font-weight:700;color:var(--ink2);text-align:center}
.fbtn.on{background:var(--ink);color:#fff}
.fbtn.on svg rect[fill="#0E1116"]{fill:#fff}.fbtn.on svg rect[fill="#D9DDE4"]{fill:#4A5160}
.q+.q{margin-top:22px}
.q>b{display:block;font-size:17px;font-weight:800;margin-bottom:10px}
/* report */
.delta{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:24px;padding:0 8px;border-radius:8px;font-size:13px;font-weight:800;background:var(--soft);color:var(--ink2)}
.delta.up{background:var(--ink);color:#fff}.delta.down{background:var(--down-w);color:var(--down)}
.ba{display:flex;align-items:center;gap:14px;margin-top:16px}
.ba .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ba .arr{color:var(--ink3)}
.kv{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.blk{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--soft)}
.blk:first-of-type{border-top:0}
.blk .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff}
.blk b{font-weight:800;font-size:16px;display:block}.blk small{font-size:12px;color:var(--ink3);font-weight:600}
.blk .c{text-align:center;font-size:11px;color:var(--ink3);font-weight:700}
.find li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--soft)}.find li:first-child{border-top:0;padding-top:0}
.find i{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--ink3)}.find .good i{background:#12B76A}.find .bad i{background:var(--down)}
.find b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.45}.find span{font-size:13px;color:var(--ink2)}
.day{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0}
.day .d{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.day .t{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.seq{display:flex;gap:3px;height:34px}
.seq span{border-radius:9px;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rule{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;line-height:1.55}
.out li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--soft);font-size:15px;line-height:1.55}.out li:first-child{border-top:0}
.out li svg{margin-top:2px}
.cta{position:sticky;bottom:calc(var(--sab) + 10px);margin-top:18px;z-index:3}
.cta .btn{margin:0;box-shadow:0 10px 30px rgba(14,17,22,.25)}
/* plan system */
.opt .em svg{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips .tag{white-space:normal;line-height:1.4;border-radius:10px;padding:5px 9px}
.rx-n{font-size:13px;font-weight:700;color:var(--ink2)}
.rx-t{font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.3;margin-top:2px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:14px}
.rpe i{height:10px;border-radius:3px;background:var(--soft)}
.rpe-l{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink3);margin-top:5px}
.rpe-l b{color:var(--ink);font-weight:800}
.tl{margin-top:16px}
.tl li{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--soft)}
.tl .tm{font-size:12px;font-weight:700;color:var(--ink3);padding-top:2px}
.tl b{display:block;font-size:15px;font-weight:800;line-height:1.4}
.tl p{font-size:14px;color:var(--ink2);line-height:1.5;margin-top:1px}
.tl small{display:block;font-size:13px;color:var(--ink3);line-height:1.5;margin-top:4px}
.tl.live li.past{opacity:.38}.tl.live li.past small,.tl.live li.next small{display:none}
.tl.live li.now{margin:0 -12px;padding:12px;border-radius:14px;border-top-color:transparent;background:var(--soft)}
.tl.live li.now+li{border-top-color:transparent}
.tl.live li.now .tm{color:var(--ink)}
.tip{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;line-height:1.6;color:var(--ink2)}
.tip b{color:var(--ink)}
details.how{margin-top:12px;border-top:1px solid var(--soft);padding-top:12px}
details.how summary{font-size:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"+";font-size:18px;color:var(--ink3);font-weight:600}
details.how[open] summary::after{content:"−"}
details.how li{font-size:14px;color:var(--ink2);line-height:1.6;padding:6px 0 0 14px;position:relative}
details.how li::before{content:"";position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.stop .rxs{display:block;font-size:13px;font-weight:600;color:var(--ink2);line-height:1.45;margin-top:3px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:20px}
.seg button{height:40px;border-radius:11px;text-align:center;font-size:14px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(14,17,22,.08)}
.dayb{display:block;width:100%;padding:14px 0;border-top:1px solid var(--soft)}
.dayb:first-of-type{border-top:0;padding-top:0}
.dayb .hd{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800}
.dayb .hd .d{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.dayb .hd .go{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink3)}
.dayb .seq{margin-top:10px;height:8px}.dayb .seq span{border-radius:4px}
.ln{display:grid;grid-template-columns:8px minmax(0,1fr);gap:9px;font-size:13px;line-height:1.5;color:var(--ink2);margin-top:7px}
.ln i{width:8px;height:8px;border-radius:50%;margin-top:6px}
.ln b{color:var(--ink);font-weight:700}
.wk li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--soft);font-size:14px;line-height:1.55;color:var(--ink2)}
.wk li:first-child{border-top:0;padding-top:0}
.wk li b{font-size:13px;font-weight:800;color:var(--ink)}
.rl li{display:grid;grid-template-columns:44px 52px minmax(0,1fr);gap:8px;padding:8px 0;font-size:13px;color:var(--ink2);align-items:center}
.rl li b{font-weight:800;color:var(--ink)}
.rl i{display:block;height:8px;border-radius:3px;background:var(--ink)}
.lg li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--soft);font-size:14px}
.lg li:first-child{border-top:0;padding-top:0}
.lg small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.lg b{font-weight:800}
.mini{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:700;color:var(--ink2);margin-top:12px}
.sh{display:flex;align-items:center;gap:12px}
.sh .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.sh b{display:block;font-size:17px;font-weight:800}.sh small{font-size:12px;color:var(--ink3);font-weight:700}
.center{flex:1;display:grid;place-items:center;color:var(--ink3)}
.fade{animation:f .22s ease}@keyframes f{from{transform:translateY(6px)}to{transform:none}}
@media (min-width:520px){body{background:#E9EBEF}#app{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"><div class="center">…</div></div>
<script>
/* Condition Planet V1.5 — one-day class logic (shared by the member page and the coach page).
   assign(): puts people with similar preferences and condition in the same team and gives each team an order of the three stations.
   report(): turns one person's start state + three checks into findings, a one-week plan and a cautious one-month outlook. */
(function (g) {
'use strict';
const ST = { cardio: { ko: '유산소', c: '#FF6A3D', w: '#FFEEE7' }, weights: { ko: '웨이트', c: '#3D5AFE', w: '#E9EDFF' }, stretch: { ko: '스트레칭', c: '#0FA37A', w: '#E2F6EF' } };
const KEYS = ['cardio', 'weights', 'stretch'];
const TEAMS = [
  { id: 1, name: '달리기 팀', ord: ['cardio', 'weights', 'stretch'], line: '심박을 먼저 올리고, 힘을 쓰고, 풀면서 끝냅니다.' },
  { id: 2, name: '힘쓰기 팀', ord: ['weights', 'stretch', 'cardio'], line: '힘이 있을 때 먼저 들고, 풀어 준 뒤, 유산소로 끝냅니다.' },
  { id: 3, name: '깨우기 팀', ord: ['stretch', 'cardio', 'weights'], line: '몸을 먼저 깨우고, 심박을 올린 뒤, 마지막에 힘을 씁니다.' },
];
const jong = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 : 0; };
const ro = (w) => w + (jong(w) === 0 || jong(w) === 8 ? '로' : '으로');
const un = (w) => w + (jong(w) ? '은' : '는');
const sg = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const lowCount = (m) => (m.energy0 <= 2 ? 1 : 0) + (m.body0 <= 2 ? 1 : 0) + (m.mood0 <= 2 ? 1 : 0);

// how well a station order fits one person right now
function score(m, t) {
  const p = m.pref || {}, first = t.ord[0], last = t.ord[2], low = lowCount(m);
  let s = 1.5 * (p[first] || 0) + 0.5 * (p[last] || 0);
  if (first === 'stretch') s += 1.2 * low;
  if (first === 'cardio') s += (m.energy0 >= 4 ? 1 : 0) - 0.8 * low;
  if (first === 'weights') s += (m.energy0 >= 4 && m.body0 >= 3 ? 0.8 : 0) - (m.body0 <= 2 ? 1.2 : 0) - 0.4 * low;
  return s;
}
const bestTeam = (m) => TEAMS.slice().sort((a, b) => score(m, b) - score(m, a))[0];
function reason(m, t) {

async function flushPending() {
  if (S.spend.length) await flushSolo();
  if (!S.pending || !S.key || PV) return;
  const p = S.pending;
  try { setState(await rpc('v15_check', { p_key: S.key, p_round: p.round, p_mood: p.mood, p_body: p.body })); S.pending = null; LS.del('pend.' + slug); }
  catch (e) { if (!e.net && e.code !== 'round_not_started') { S.pending = null; LS.del('pend.' + slug); S.err = '기록하지 못했어요. 다시 눌러 주세요.'; } }
}
async function flushSolo() {
  if (!S.key || PV) return;
  for (const p of S.spend.slice()) {
    let drop = true;
    try { setState(await rpc('v15_solo', { p_key: S.key, p_cid: p.cid, p_label: p.label, p_minutes: p.minutes, p_mood0: p.mood0, p_body0: p.body0, p_mood1: p.mood1, p_body1: p.body1 })); }
    catch (e) { if (e.net) drop = false; }
    if (!drop) break;

}
async function poll() {

const stepOn = () => { LS.set('in.' + slug, S.in); render(); setTimeout(() => { if (S.in.step < QS.length - 1) { S.in.step++; LS.set('in.' + slug, S.in); render(); window.scrollTo(0, 0); } else submitIntake(); }, 170); };
