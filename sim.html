<title>컨디션 플래닛 · 전체 시뮬레이션</title>
<style>
:root{--bg:#F6F7F9;--card:#fff;--ink:#0E1116;--ink2:#4A5160;--ink3:#8B93A1;--line:#E6E8EC;--soft:#EEF0F3;--sun:#FFE27A;--down:#C2341A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
h1,h2,p,ol{margin:0;padding:0} ol{list-style:none}
.wrap{max-width:1640px;margin:0 auto;padding:0 24px 60px}
.top{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800}
.pill{font-size:12px;font-weight:700;color:var(--ink2);background:var(--soft);padding:3px 10px;border-radius:999px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn[disabled]{opacity:.35;cursor:default}
a.btn{text-decoration:none}
/* guide */
.guide{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;border-radius:22px;padding:18px 22px;display:flex;gap:14px 22px;align-items:center;flex-wrap:wrap;box-shadow:0 14px 36px rgba(14,17,22,.22)}
.guide .who{flex:none;font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--sun);color:var(--ink)}
.guide .txt{flex:1;min-width:260px}
.guide .txt small{display:block;font-size:13px;font-weight:700;color:#AEB5C2}
.guide .txt b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
.guide .ctl{display:flex;gap:8px;flex-wrap:wrap}
.guide .btn{background:#fff;color:var(--ink)}
.guide .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #5B6373}
.guide .btn.on{background:var(--sun);box-shadow:none;color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.steps li{font-size:13px;font-weight:700;color:var(--ink3);padding:5px 11px;border-radius:999px;background:var(--soft)}
.steps li.past{color:var(--ink2)}
.steps li.cur{background:var(--ink);color:#fff}
/* stage */
.grid{display:grid;grid-template-columns:410px minmax(0,1fr);gap:22px;align-items:start}
.col h2{font-size:14px;font-weight:800;color:var(--ink3);letter-spacing:.02em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.col h2 i{font-style:normal;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--sun);color:var(--ink);visibility:hidden}
.col.act h2{color:var(--ink)}.col.act h2 i{visibility:visible}
.phone{width:410px;height:800px;border-radius:44px;background:#0E1116;padding:10px;box-shadow:0 30px 60px rgba(14,17,22,.18);transition:box-shadow .2s}
.phone iframe{width:390px;height:780px;border:0;border-radius:34px;background:var(--bg);display:block}
.screen{border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:0 30px 60px rgba(14,17,22,.12),0 0 0 1px var(--line);transition:box-shadow .2s}
.screen iframe{width:1360px;border:0;transform-origin:0 0;display:block}
.col.act .phone{box-shadow:0 0 0 5px var(--sun),0 30px 60px rgba(14,17,22,.18)}
.col.act .screen{box-shadow:0 0 0 5px var(--sun),0 30px 60px rgba(14,17,22,.12)}
.tabs{display:none;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;height:42px;border-radius:11px;font-weight:700;color:var(--ink2);text-align:center;position:relative}
.tabs button.on{background:var(--card);color:var(--ink)}
.tabs button.need::after{content:"";position:absolute;top:8px;right:12px;width:9px;height:9px;border-radius:50%;background:#F5B700}
.note{font-size:14px;color:var(--ink3);margin-top:18px}
@media (max-width:1100px){
  .tabs{display:flex}.grid{grid-template-columns:minmax(0,1fr)}.top .pill{display:none}.guide .ctl .btn{min-height:38px;padding:0 12px;font-size:14px}
  .grid.m .col.c,.grid.c .col.m{display:none}
  .phone{width:min(410px,100%);height:auto;margin:0 auto;padding:8px;border-radius:36px}.phone iframe{width:100%;height:min(780px,calc(100vh - 250px));min-height:520px;border-radius:28px}
  .guide{border-radius:18px;padding:14px 16px}.guide .txt b{font-size:17px}.wrap{padding:0 14px 40px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand"><svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#0E1116"/><g transform="rotate(22 50 50)"><ellipse cx="50" cy="50" rx="39" ry="12.5" fill="none" stroke="#fff" stroke-width="6"/></g><circle cx="50" cy="50" r="20.5" fill="#567AFF"/></svg>컨디션 플래닛</span><span class="pill">전체 시뮬레이션</span><span class="sp"></span><a class="btn ghost" href="tour.html">소개 페이지</a></div>
  <div class="guide"><span class="who" id="who">회원 폰</span><div class="txt"><small id="stepno">지금 할 일</small><b id="todo">불러오는 중…</b></div>
    <div class="ctl"><button class="btn" id="skip" disabled>블록 끝으로 넘기기</button><button class="btn ghost" id="fast">20배속</button><button class="btn ghost" id="reset">처음부터 다시</button></div></div>
  <ol class="steps" id="steps"></ol>
  <div class="tabs" id="tabs"><button data-v="m" class="on">회원 폰</button><button data-v="c">코치 화면</button></div>
  <div class="grid m" id="grid">
    <div class="col m" id="colm"><h2>회원 폰 <i>여기를 누르세요</i></h2><div class="phone"><iframe id="fm" title="회원 화면" src="./?sim=1"></iframe></div></div>
    <div class="col c" id="colc"><h2>코치 화면 <i>여기를 누르세요</i></h2><div class="screen" id="screen"><iframe id="fc" title="코치 화면" src="coach.html?sim=1"></iframe></div></div>
  </div>
  <p class="note">가상 수업입니다. 가상 회원 8명이 이미 입장해 있고, 체크 단계에서 스스로 답합니다. 여기서 누른 내용은 이 브라우저에만 저장되며 실제 수업 기록에는 들어가지 않습니다.</p>
</div>
<script>
/* Condition Planet V1.5 — one-day class logic (shared by the member page and the coach page).
   assign(): puts people with similar preferences and condition in the same team and gives each team an order of the three stations.
   report(): turns one person's start state + three checks into findings, a one-week plan and a cautious one-month outlook. */
(function (g) {
'use strict';
const ST = { cardio: { ko: '유산소', c: '#FF6A3D', w: '#FFEEE7' }, weights: { ko: '웨이트', c: '#3D5AFE', w: '#E9EDFF' }, stretch: { ko: '스트레칭', c: '#0FA37A', w: '#E2F6EF' } };
const KEYS = ['cardio', 'weights', 'stretch'];
const TEAMS = [
  { id: 1, name: '달리기 팀', ord: ['cardio', 'weights', 'stretch'], line: '심박을 먼저 올리고, 힘을 쓰고, 풀면서 끝냅니다.' },
  { id: 2, name: '힘쓰기 팀', ord: ['weights', 'stretch', 'cardio'], line: '힘이 있을 때 먼저 들고, 풀어 준 뒤, 유산소로 끝냅니다.' },
  { id: 3, name: '깨우기 팀', ord: ['stretch', 'cardio', 'weights'], line: '몸을 먼저 깨우고, 심박을 올린 뒤, 마지막에 힘을 씁니다.' },
];
const jong = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 : 0; };
const ro = (w) => w + (jong(w) === 0 || jong(w) === 8 ? '로' : '으로');
const un = (w) => w + (jong(w) ? '은' : '는');
const sg = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const lowCount = (m) => (m.energy0 <= 2 ? 1 : 0) + (m.body0 <= 2 ? 1 : 0) + (m.mood0 <= 2 ? 1 : 0);

// how well a station order fits one person right now
function score(m, t) {
  const p = m.pref || {}, first = t.ord[0], last = t.ord[2], low = lowCount(m);
  let s = 1.5 * (p[first] || 0) + 0.5 * (p[last] || 0);
  if (first === 'stretch') s += 1.2 * low;
  if (first === 'cardio') s += (m.energy0 >= 4 ? 1 : 0) - 0.8 * low;
  if (first === 'weights') s += (m.energy0 >= 4 && m.body0 >= 3 ? 0.8 : 0) - (m.body0 <= 2 ? 1.2 : 0) - 0.4 * low;
  return s;
}
const bestTeam = (m) => TEAMS.slice().sort((a, b) => score(m, b) - score(m, a))[0];
function reason(m, t) {
  const p = m.pref || {}, low = lowCount(m), first = ST[t.ord[0]].ko;
  const state = low >= 2 ? `지금 에너지 ${m.energy0}, 몸 상태 ${m.body0}로 낮은 편이라` : m.energy0 >= 4 ? `에너지가 ${m.energy0}로 충분해서` : '컨디션이 무난해서';
  let s = low >= 2 && t.ord[0] !== 'stretch' && bestTeam(m) !== t
    ? `오늘은 세 명씩 팀을 맞추느라 ${ro(first)} 시작합니다. 지금 에너지 ${m.energy0}, 몸 상태 ${m.body0}로 낮은 편이니 첫 블록은 평소보다 가볍게 하세요.`
    : `${state} ${ro(first)} 시작합니다. ${t.line}`;
  const dis = KEYS.filter((k) => p[k] < 0), like = KEYS.filter((k) => p[k] > 0);
  dis.forEach((k) => { const i = t.ord.indexOf(k); s += ` 싫어한다고 고른 ${un(ST[k].ko)} ${['맨 먼저 끝내도록 앞에', '몸이 풀린 가운데에', '마지막에'][i]} 넣었습니다.`; });
  if (dis.length) s += ' 하고 난 뒤 기분이 어떻게 변하는지 보는 것이 오늘의 실험입니다.';
  else if (like.length) s += ` 좋아하는 ${like.map((k) => ST[k].ko).join('·')}${like.length ? '도' : ''} 숫자로 확인해 봅니다.`;
  return s;
}
// Best total fit with balanced team sizes (exhaustive search; a class is small)
function assign(members) {
  const n = members.length; if (!n) return [];
  const hi = Math.ceil(n / 3), lo = n >= 3 ? Math.floor(n / 3) : 0, sc = members.map((m) => TEAMS.map((t) => score(m, t)));
  const maxRest = new Array(n + 1).fill(0); for (let i = n - 1; i >= 0; i--) maxRest[i] = maxRest[i + 1] + Math.max(...sc[i]);
  let best = null, bestV = -1e9; const cur = new Array(n), cnt = [0, 0, 0];
  (function go(i, v) {
    if (v + maxRest[i] <= bestV) return;
    if (i === n) { if (cnt.every((c) => c >= lo)) { bestV = v; best = cur.slice(); } return; }
    for (let t = 0; t < 3; t++) { if (cnt[t] >= hi) continue; cnt[t]++; cur[i] = t; go(i + 1, v + sc[i][t]); cnt[t]--; }
  })(0, 0);
  if (!best) best = members.map((m) => TEAMS.indexOf(bestTeam(m)));
  return members.map((m, i) => { const t = TEAMS[best[i]]; return { id: m.id, team: t.id, ord: t.ord, kind: t.name, reason: reason(m, t) }; });
}
const one = (m) => { const t = bestTeam(m); return { id: m.id, team: t.id, ord: t.ord, kind: t.name, reason: reason(m, t) }; };

function rows(m) {
  const ch = (m.checks || []).slice().sort((a, b) => a.round - b.round); let pm = m.mood0, pb = m.body0;
  return ch.map((c) => { const r = { round: c.round, st: c.station, m0: pm, m1: c.mood, b0: pb, b1: c.body, dm: c.mood - pm, db: c.body - pb, pref: (m.pref || {})[c.station] || 0 }; pm = c.mood; pb = c.body; return r; });
}
function report(m) {
  const R = rows(m); if (R.length < 3) return null;
  const end = R[2], dmT = end.m1 - m.mood0, dbT = end.b1 - m.body0, name = (k) => ST[k].ko;
  const byMood = R.slice().sort((a, b) => b.dm - a.dm || b.db - a.db), byBody = R.slice().sort((a, b) => b.db - a.db || b.dm - a.dm), best = byMood[0];
  const F = [];
  F.push({ tone: dmT > 0 ? 'good' : dmT < 0 ? 'bad' : 'info', text: `45분 동안 기분 ${m.mood0} → ${end.m1}, 몸 상태 ${m.body0} → ${end.b1}.`, ev: `기분 ${sg(dmT)} · 몸 ${sg(dbT)}` });
  const even = best.dm > 0 && byMood[2].dm === best.dm;
  if (even) F.push({ tone: 'good', text: `세 블록 모두 기분이 ${sg(best.dm)}씩 올랐습니다.`, ev: '오늘의 순서 자체가 잘 맞았습니다.' });
  else if (best.dm > 0) F.push({ tone: 'good', text: `기분이 가장 많이 오른 건 ${name(best.st)} 15분이었습니다.`, ev: `${name(best.st)} 전 ${best.m0} → 후 ${best.m1} (${sg(best.dm)})` });
  else F.push({ tone: 'info', text: '오늘은 어느 블록에서도 기분이 뚜렷하게 오르지 않았습니다.', ev: '순서와 시간을 바꿔 가며 맞는 조합을 찾아야 하는 날입니다.' });
  R.forEach((r) => {
    if (r.pref < 0 && r.dm > 0) F.push({ tone: 'good', text: `싫어한다고 고른 ${name(r.st)} 뒤에 기분이 올랐습니다.`, ev: `${r.m0} → ${r.m1} (${sg(r.dm)}) · '싫어하는 운동'과 '안 맞는 운동'은 다를 수 있습니다.` });
    else if (r.pref < 0) F.push({ tone: 'info', text: `싫어한다고 고른 ${name(r.st)} 뒤에는 기분이 오르지 않았습니다.`, ev: `${r.m0} → ${r.m1} · 느낌과 숫자가 일치했습니다.` });
    else if (r.pref > 0 && r.dm <= 0) F.push({ tone: 'bad', text: `좋아한다고 고른 ${name(r.st)} 뒤에는 기분이 ${r.dm < 0 ? '내려갔습니다' : '그대로였습니다'}.`, ev: `${r.m0} → ${r.m1} · 익숙한 운동이라 자극이 적었을 수 있습니다.` });
    else if (r.dm < 0) F.push({ tone: 'bad', text: `${name(r.st)} 뒤에는 기분이 내려갔습니다.`, ev: `${r.m0} → ${r.m1} · 순서나 시간을 바꿔 볼 대상입니다.` });
  });
  if (byBody[0].db > 0) F.push({ tone: 'good', text: `몸은 ${name(byBody[0].st)} 뒤에 가장 가벼워졌습니다.`, ev: `몸 상태 ${byBody[0].b0} → ${byBody[0].b1} (${sg(byBody[0].db)})` });
  // one-week plan built from today's response: open with what loosened the body, close with what lifted the mood
  const closer = best.st, others = byBody.filter((r) => r.st !== closer), opener = others[0].st, mid = others[1].st;
  const weak = others.slice().sort((a, b) => a.dm - b.dm)[0].st, mins = (k) => (k === closer ? 20 : k === weak ? 10 : 15);
  const type = even ? '오늘의 순서가 잘 맞는 리듬' : best.dm > 0 ? `${ro(name(closer))} 기분이 올라가는 리듬` : '아직 맞는 순서를 찾는 중';
  const core = even ? R.map((r) => `${name(r.st)} 15분`).join(' → ') : `${name(opener)} ${mins(opener)}분 → ${name(mid)} ${mins(mid)}분 → ${name(closer)} 20분`;
  const week = [
    { d: '월', t: '기본 45분', x: core },
    { d: '수', t: '짧은 날 25분', x: `${name(opener)} 10분 → ${name(closer)} 15분` },
    { d: '금', t: '기본 45분', x: core },
    { d: '토', t: '바꿔 보기 45분', x: `${name(closer)} 15분 → ${name(mid)} 15분 → ${name(opener)} 15분` },
  ];
  week.forEach((w) => { w.seq = w.x.split(' → ').map((p) => { const m = p.match(/^(.+) ([0-9]+)분$/); return { st: KEYS.find((k) => ST[k].ko === m[1]), min: +m[2] }; }); });
  const why = even ? '세 블록이 고르게 효과가 있었으니 오늘 순서를 그대로 기본으로 씁니다. 토요일은 순서를 뒤집어 차이가 있는지 확인합니다.' : `몸을 가장 풀어 준 ${ro(name(opener))} 시작하고, 기분을 가장 올린 ${ro(name(closer))} 끝내 좋은 기분으로 나갑니다. 기분이 가장 덜 올랐던 ${un(name(weak))} 10분으로 줄였습니다. 토요일은 순서를 뒤집어 차이가 있는지 확인합니다.`;
  const rule = `기분이 2 이하인 날은 ${name(closer)} 15분만 하고 가도 됩니다.`;
  const up = R.filter((r) => r.dm > 0).length;
  const month = [
    '한 달이면 16번, 640분입니다. 주 160분으로 세계보건기구 권장량(주 150분)을 채웁니다.',
    dmT > 0 ? `오늘 기분은 ${m.mood0} → ${end.m1}. 오늘처럼 반응한다면 한 달 동안 대부분의 날에 올 때보다 좋은 기분으로 헬스장을 나서게 됩니다.` : '오늘은 변화가 작았습니다. 한 달 동안 순서와 시간을 바꿔 가며 기분이 오르는 조합을 찾는 것이 목표입니다.',
    `오늘 세 블록 중 ${up}개에서 기분이 올랐습니다. 16번의 기록이 쌓이면 어느 요일, 어느 시간, 어느 순서가 맞는지 실제 숫자로 다시 짭니다.`,
  ];
  return { rows: R, dmT, dbT, findings: F, type, week, why, rule, month, closer, opener };
}
// class-level conclusions for the coach
function summary(members) {
  const done = members.filter((m) => (m.checks || []).length >= 3), all = [].concat(...done.map(rows));
  const avg = (a) => (a.length ? Math.round((a.reduce((x, y) => x + y, 0) / a.length) * 10) / 10 : null);

const STEPS = ['입장', '목표 · 상태', '팀 편성', '1블록', '체크', '2블록', '체크', '3블록', '체크', '리포트 · 내 플랜'];
function guide() {
  const d = CPSim.peek(), c = d.class, h = d.members.filter((m) => !m.is_bot).pop(), ph = c.phase, r = ph[1] ? +ph[1] : 0;
  const over = ph[0] === 'r' && c.now_ms >= c.started_ms + c.minutes * 60000, has = (n) => !!h && h.checks.some((x) => x.round === n);
  if (!h) return { i: 0, side: 'm', t: '폰에 이름과 뒷 4자리를 아무거나 넣고 [동의하고 시작하기]를 누르세요.' };
  if (!h.intake) return { i: 1, side: 'm', t: '폰에서 목표, 수준, 좋아하는 운동, 지금 상태를 고르세요. 여덟 번 누르면 끝납니다.' };
  if (ph === 'intake') return { i: 2, side: 'c', t: '회원 답변이 코치 화면에 자동으로 들어왔습니다. 코치 화면에서 [팀 편성하기]를 누르세요.' };
  if (ph === 'teams') return { i: 2, side: 'c', t: '폰에 팀, 순서, 구역별 처방이 떴습니다. 확인했으면 코치 화면에서 [1블록 시작]을 누르세요.' };
  if (ph[0] === 'r' && !over) return { i: r * 2 + 1, side: 'm', skip: 1, t: `${r}블록이 진행 중입니다. 폰에 지금 할 운동이 분 단위로 나옵니다. 다 봤으면 [블록 끝으로 넘기기]를 누르세요.` };
  if (ph[0] === 'r' || (ph[0] === 'c' && !has(r))) return has(r) ? { i: r * 2 + 2, side: 'c', t: '코치 화면에서 [블록 끝내고 체크 받기]를 누르세요. 가상 회원들이 체크를 냅니다.' } : { i: r * 2 + 2, side: 'm', t: '시간이 끝나 폰이 체크 화면으로 바뀌었습니다. 기분과 몸 상태를 한 번씩 누르세요.' };
  if (ph === 'c1' || ph === 'c2') return { i: r * 2 + 2, side: 'c', t: `체크가 모였습니다. 코치 화면에서 [${r + 1}블록 시작]을 누르세요.` };
  if (ph === 'c3') return { i: 9, side: 'c', t: '폰에는 벌써 개인 리포트가 떴습니다. 코치 화면에서 [수업 마무리하기]를 누르면 오늘의 결론이 나옵니다.' };
  return { i: 9, side: 'm', skip: 2, t: '폰에서 리포트를 보고, [내 플랜] 탭 → 요일 → [이 운동 시작하기]로 혼자 하는 날까지 해 보세요. 코치 화면 아래에는 오늘의 결론이 있습니다.' };
}
let sig = '';
function tick() {
  const g = guide(), sp = CPSim.peek().speed, s = JSON.stringify(g) + sp; if (s === sig) return; sig = s;
  $('who').textContent = g.side === 'm' ? '회원 폰' : '코치 화면'; $('todo').textContent = g.t; $('stepno').textContent = `지금 할 일 · ${Math.min(g.i + 1, STEPS.length)} / ${STEPS.length}`;
  $('steps').innerHTML = STEPS.map((x, i) => `<li class="${i < g.i ? 'past' : i === g.i ? 'cur' : ''}">${x}</li>`).join('');
  $('colm').classList.toggle('act', g.side === 'm'); $('colc').classList.toggle('act', g.side === 'c');
  $('skip').disabled = !g.skip; $('skip').textContent = g.skip === 2 ? '운동 시간 넘기기' : '블록 끝으로 넘기기'; $('skip').dataset.v = g.skip || '';
  $('fast').classList.toggle('on', sp > 1); $('fast').textContent = sp > 1 ? '20배속 켜짐' : '20배속';
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('need', b.dataset.v === g.side && !grid.classList.contains(g.side)));
}
$('skip').addEventListener('click', () => { if ($('skip').dataset.v === '2') CPSim.jump(20 * 60000); else CPSim.skip(); sig = ''; tick(); });
$('fast').addEventListener('click', () => { CPSim.speed(CPSim.peek().speed > 1 ? 1 : 20); sig = ''; tick(); });
$('reset').addEventListener('click', () => { CPSim.reset(8); fm.src = './?sim=1&t=' + Date.now(); fc.src = 'coach.html?sim=1&t=' + Date.now(); sig = ''; tick(); });
$('tabs').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; grid.className = 'grid ' + b.dataset.v; document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); fit(); sig = ''; tick(); });
setInterval(tick, 400); tick();
})();
</script>
